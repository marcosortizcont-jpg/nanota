<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Usuários — NaNota</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<main class="wrap" id="app"><div class="gate">Carregando…</div></main>
<script src="/admin.js"></script>
<script>
'use strict';
let USERS = [], PLANS = [], OUT = '';
const F = { q: '', role: '', plan: '', status: '' };
const roleOf = u => u.is_master ? 'master' : u.role;
const roleLabel = u => u.is_master ? 'Master' : u.role === 'admin' ? 'Administrador' : 'Membro';
const stBadge = u => u.status === 'active' ? '<span class="badge ok">ativo</span>' : u.status === 'invited' ? '<span class="badge warn">convite pendente</span>' : '<span class="badge bad">bloqueado</span>';
const subBadge = u => u.sub_status === 'ativa' ? '<span class="badge ok">assinatura ativa</span>' : u.sub_status === 'suspensa' ? '<span class="badge warn">suspensa</span>' : '<span class="muted small">sem assinatura</span>';
const planName = id => (PLANS.find(p => p.id === id) || {}).name || id;

function linkBox(link, email, purpose) {
  const msg = (purpose === 'reset' ? 'Use este link para criar uma nova senha no NaNota: ' : 'Você foi convidado para o NaNota! Crie sua senha aqui: ') + link;
  return `<div class="box"><div class="info"><b>${purpose === 'reset' ? 'Link de nova senha' : 'Convite criado'}</b> para ${esc(email)} — vale por 7 dias e só pode ser usado uma vez.</div>
    <div class="chips" style="margin-top:8px"><input type="text" readonly value="${esc(link)}" onclick="this.select()" class="mono" style="flex:1;min-width:240px">
    <button class="btn sm primary" data-copy="${esc(link)}">Copiar link</button><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar pelo WhatsApp</a>
    <button class="btn sm ghost" data-closeout="1">✕</button></div></div>`;
}

async function load() {
  const [u, p] = await Promise.all([api('GET', '/api/admin/users'), api('GET', '/api/admin/plans')]);
  USERS = u.users; PLANS = p.plans; draw();
}
function draw() {
  const q = F.q.trim().toLowerCase();
  const list = USERS.filter(u => (!q || (u.name + ' ' + u.email).toLowerCase().includes(q)) && (!F.role || roleOf(u) === F.role) && (!F.plan || u.plan_id === F.plan) && (!F.status || u.status === F.status));
  const n = s => USERS.filter(u => u.status === s).length;
  $('#app').innerHTML = `
    <h1>👥 Usuários</h1>
    <div class="cards">
      <div class="card"><div class="l">Total</div><div class="v">${USERS.length}</div></div>
      <div class="card ok"><div class="l">Ativos</div><div class="v">${n('active')}</div></div>
      <div class="card warn"><div class="l">Convites pendentes</div><div class="v">${n('invited')}</div></div>
      <div class="card bad"><div class="l">Bloqueados</div><div class="v">${n('disabled')}</div></div>
      <div class="card"><div class="l">Com cobrança vencida</div><div class="v">${USERS.filter(u => u.overdue > 0).length}</div></div>
    </div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Buscar por nome ou e-mail…" value="${esc(F.q)}">
      <select id="fr"><option value="">Todos os perfis</option><option value="master">Master</option><option value="admin">Administradores</option><option value="member">Membros</option></select>
      <select id="fp"><option value="">Todos os planos</option>${PLANS.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>
      <select id="fs"><option value="">Todas as situações</option><option value="active">Ativos</option><option value="invited">Convite pendente</option><option value="disabled">Bloqueados</option></select>
      <button class="btn primary" id="new">+ Novo usuário</button>
    </div>
    <div id="out">${OUT}</div>
    ${list.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Usuário</th><th>Perfil</th><th>Plano</th><th>Situação</th><th>Uso</th><th>Último acesso</th><th></th></tr></thead><tbody>
    ${list.map(u => { const self = u.id === ME.id, locked = u.is_master || (!ME.isMaster && u.role === 'admin');
      return `<tr><td><b>${esc(u.name || '—')}</b>${self ? ' <span class="muted small">(você)</span>' : ''}<div class="muted small">${esc(u.email)}</div></td>
      <td>${u.is_master ? '<span class="badge warn">Master</span>' : u.role === 'admin' ? '<span class="badge info">Administrador</span>' : '<span class="badge">Membro</span>'}</td>
      <td>${esc(planName(u.plan_id))}<div>${subBadge(u)}${u.overdue ? ` <span class="badge bad">${u.overdue} vencida${u.overdue > 1 ? 's' : ''}</span>` : ''}</div></td>
      <td>${stBadge(u)}</td>
      <td class="small muted">${u.songs} músicas<br>${u.sets} repertórios</td>
      <td class="small">${fmtTs(u.last_login_at)}</td>
      <td><div class="acts">
        ${!locked || self ? `<button class="btn sm" data-edit="${u.id}">Editar</button>` : ''}
        ${!self && !locked ? `<button class="btn sm" data-link="${u.id}">${u.status === 'invited' ? 'Novo convite' : 'Nova senha'}</button>
          ${u.status === 'disabled' ? `<button class="btn sm" data-en="${u.id}">Desbloquear</button>` : `<button class="btn sm" data-dis="${u.id}">Bloquear</button>`}
          <button class="btn sm danger" data-del="${u.id}">Excluir</button>` : ''}
        ${ME.isMaster ? `<a class="btn sm ghost" href="/financeiro.html?usuario=${u.id}" title="Ver no financeiro">💰</a>` : ''}
      </div></td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty">Nenhum usuário encontrado.</div>'}
    <p class="muted small" style="margin-top:14px">Administradores convidam e gerenciam membros. Só o master cria administradores e define planos. Cada pessoa cria a própria senha pelo link de convite — ninguém vê as senhas.</p>`;
  $('#fr').value = F.role; $('#fp').value = F.plan; $('#fs').value = F.status;
  $('#q').oninput = e => { F.q = e.target.value; const p = e.target.selectionStart; draw(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  $('#fr').onchange = e => { F.role = e.target.value; draw(); };
  $('#fp').onchange = e => { F.plan = e.target.value; draw(); };
  $('#fs').onchange = e => { F.status = e.target.value; draw(); };
  $('#new').onclick = openNew;
}
function planSelect(id, sel) { return `<select id="${id}">${PLANS.map(p => `<option value="${esc(p.id)}" ${(sel ? p.id === sel : p.isDefault) ? 'selected' : ''}>${esc(p.name)} — ${money(p.priceCents, p.interval)}</option>`).join('')}</select>`; }
function openNew() {
  const m = modal(`<div class="mh">Novo usuário</div><div class="mb">
    <label class="f">Nome<input type="text" id="nN" placeholder="Nome completo"></label>
    <label class="f">E-mail<input type="email" id="nE" placeholder="email@exemplo.com"></label>
    <div class="grid2"><label class="f">Perfil<select id="nR"><option value="member">Membro</option>${ME.isMaster ? '<option value="admin">Administrador</option>' : ''}</select></label>
    ${ME.isMaster ? `<label class="f">Plano${planSelect('nP')}</label>` : ''}</div>
    <p>A pessoa recebe um link para criar a própria senha. Para cobrar um plano pago, crie a assinatura no 💰 Financeiro.</p></div>
    <div class="mf"><button class="btn" data-x="0">Cancelar</button><button class="btn primary" data-x="1">Criar e gerar convite</button></div>`);
  setTimeout(() => $('#nN', m.el).focus(), 30);
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === '0') return m.close();
    const email = $('#nE', m.el).value;
    try {
      const r = await api('POST', '/api/admin/users', { name: $('#nN', m.el).value, email, role: $('#nR', m.el).value, plan_id: $('#nP', m.el) ? $('#nP', m.el).value : undefined });
      m.close(); OUT = linkBox(r.link, email, 'invite'); toast('Usuário criado.'); load();
    } catch (err) { toast(err.message); }
  });
}
function openEdit(id) {
  const u = USERS.find(x => x.id === id); if (!u) return;
  const m = modal(`<div class="mh">Editar ${esc(u.name || u.email)}</div><div class="mb">
    <label class="f">Nome<input type="text" id="eN" value="${esc(u.name || '')}"></label>
    <label class="f">E-mail<input type="text" value="${esc(u.email)}" disabled></label>
    ${ME.isMaster && !u.is_master ? `<div class="grid2"><label class="f">Perfil<select id="eR"><option value="member" ${u.role === 'member' ? 'selected' : ''}>Membro</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Administrador</option></select></label>
      <label class="f">Plano${planSelect('eP', u.plan_id)}</label></div>
      <p class="small">Trocar o plano aqui não gera cobrança. Para cobrar, use a assinatura no 💰 Financeiro (ela também ajusta o plano).</p>` : ME.isMaster ? `<label class="f">Plano${planSelect('eP', u.plan_id)}</label>` : ''}
    </div><div class="mf"><button class="btn" data-x="0">Cancelar</button><button class="btn primary" data-x="1">Salvar</button></div>`);
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === '0') return m.close();
    const body = { name: $('#eN', m.el).value };
    if ($('#eR', m.el)) body.role = $('#eR', m.el).value;
    if ($('#eP', m.el)) body.plan_id = $('#eP', m.el).value;
    try { await api('PATCH', '/api/admin/users/' + id, body); m.close(); toast('Salvo.'); load(); } catch (err) { toast(err.message); }
  });
}
document.addEventListener('click', async e => {
  const t = e.target;
  const c = t.closest('[data-copy]'); if (c) return copyText(c.dataset.copy);
  if (t.closest('[data-closeout]')) { OUT = ''; return draw(); }
  const ed = t.closest('[data-edit]'); if (ed) return openEdit(ed.dataset.edit);
  const id = (t.closest('[data-link],[data-dis],[data-en],[data-del]') || {}).dataset; if (!id) return;
  const u = USERS.find(x => x.id === (id.link || id.dis || id.en || id.del));
  try {
    if (id.link) { const r = await api('POST', `/api/admin/users/${id.link}/link`); OUT = linkBox(r.link, u.email, r.purpose); }
    if (id.dis) { if (!(await confirmBox(`Bloquear ${u.email}? A pessoa é desconectada e não consegue entrar.`, 'Bloquear'))) return; await api('POST', `/api/admin/users/${id.dis}/disable`); }
    if (id.en) await api('POST', `/api/admin/users/${id.en}/enable`);
    if (id.del) { if (!(await confirmBox(`Excluir ${u.email}? Músicas próprias, repertórios e assinatura dessa pessoa serão apagados. Cifras padrão que ela criou passam para você. Cobranças ficam no histórico do financeiro.`, 'Excluir'))) return; await api('DELETE', `/api/admin/users/${id.del}`); }
    toast('Pronto.'); load();
  } catch (err) { toast(err.message); }
});
boot('usuarios').then(ok => ok && load()).catch(e => toast(e.message));
</script>
</body>
</html>
