async function runAudio(file,tempo){
  const out=document.getElementById('audOut');if(!out)return;stopAudio();
  out.innerHTML=`<div class="hint" style="margin-bottom:6px" id="audStep">Abrindo “${esc(file.name)}”…</div><div class="bar"><i id="audBar"></i></div>`;
  let res,dec;
  try{
    dec=AUD_CACHE&&AUD_CACHE.file===file?AUD_CACHE.dec:await decodeAudio(file);
    if(!(AUD_CACHE&&AUD_CACHE.file===file))AUD_CACHE={file,dec};
    res=await auAnalyze(dec.x,dec.sr,(p,t)=>{const b=document.getElementById('audBar');if(b)b.style.width=Math.round(p*100)+'%';const st=document.getElementById('audStep');if(st&&t)st.textContent=t},{tempo});
  }catch(e){out.innerHTML=`<div class="info warn">Não consegui analisar esse arquivo. Tente MP3, M4A ou WAV.</div>`;return}
  if(!document.getElementById('audOut'))return;
  if(!res.segs.length){out.innerHTML='<div class="info warn">Não encontrei acordes nesse áudio.</div>';return}
  AUD={audio:null,url:URL.createObjectURL(file),res,file,dec,mode:null,lyr:AUD_CACHE.running?{status:'run',p:AUD_CACHE.p}:(AUD_CACHE.lyr||null),lang:AUD_CACHE.lang||'pt'};
  drawAudioResult();
  if(!AUD.lyr&&typeof transcribeAudio==='function')startTranscribe(AUD.lang);
}
async function startTranscribe(lang){
  if(!AUD||!AUD_CACHE||AUD_CACHE.file!==AUD.file)return;
  const C=AUD_CACHE,file=C.file,dec=C.dec;
  if(C.running)return;
  C.lang=lang||C.lang||'pt';C.running=true;C.p=0;C.lyr=null;
  const sync=()=>{if(AUD&&AUD.file===file){AUD.lang=C.lang;AUD.lyr=C.running?{status:'run',p:C.p}:C.lyr;AUD.mode=null;if(document.getElementById('audOut'))drawAudioResult()}};
  sync();
  try{
    const words=await transcribeAudio(dec,{lang:C.lang,prompt:'Letra de música cantada.',onProg:p=>{C.p=p;const b=document.getElementById('lyrBar');if(b&&AUD&&AUD.file===file)b.style.width=Math.round(p*100)+'%'}});
    C.lyr=words.length?{status:'done',words}:{status:'err',msg:'Não encontrei voz cantada nesse áudio.'};
  }catch(e){C.lyr={status:'err',msg:e.message||'Não consegui transcrever a letra.'}}
  C.running=false;
  if(C.lyr.status==='err')C.lyrErr=C.lyr;
  sync();
}
let AUD_CACHE=null;
function drawAudioResult(){
  const out=document.getElementById('audOut');if(!out||!AUD)return;
  const {res,file,dec}=AUD;
  const comb=IMP.chart?combineChart(res,IMP.chart.text):null;
  const L=AUD.lyr||{},canTr=typeof transcribeAudio==='function';
  const lyrC=L.status==='done'?lyricChart(res,L.words):null;
  if(!AUD.mode||(AUD.mode==='comb'&&!comb)||(AUD.mode==='letra'&&!lyrC))AUD.mode=comb?'comb':lyrC?'letra':'audio';
  const view=AUD.mode==='comb'?comb:AUD.mode==='letra'?{content:lyrC}:null;
  const LANGS=[['pt','Português'],['en','Inglês'],['es','Espanhol'],['it','Italiano'],['fr','Francês']];
  const langSel=`<select class="sm-sel" id="lyrLang" title="Idioma da letra">${LANGS.map(([k,n])=>`<option value="${k}" ${AUD.lang===k?'selected':''}>${n}</option>`).join('')}</select>`;
  const lyrBox=!canTr?`<div class="info">🎤 A <b>transcrição da letra</b> funciona no site do NaNota (com login). Aqui você pode anexar a cifra com letra no campo acima.</div>`
    :L.status==='run'?`<div class="box2"><div class="hint" style="margin-bottom:6px">🎤 Transcrevendo a letra com IA… os acordes já estão prontos abaixo.</div><div class="bar"><i id="lyrBar" style="width:${Math.round((L.p||0)*100)}%"></i></div></div>`
    :L.status==='err'?`<div class="info warn">🎤 ${esc(L.msg)} <span class="chips" style="display:inline-flex">${langSel}<button class="btn sm" data-lyr="go">Tentar de novo</button></span></div>`
    :L.status==='done'?`<div class="chips"><span class="chip">🎤 Letra: <b>${L.words.length} palavras</b></span>${langSel}<button class="btn sm" data-lyr="go" title="Transcrever de novo no idioma escolhido">↻ Transcrever de novo</button></div>`
    :`<div class="chips">${langSel}<button class="btn sm primary" data-lyr="go">🎤 Transcrever a letra</button></div>`;
  const t=AUD.audio?AUD.audio.currentTime:0,wasPlaying=!!(AUD.audio&&!AUD.audio.paused);
  out.innerHTML=`<audio controls src="${AUD.url}" id="audEl"></audio>
    <div class="chips"><span class="chip">Tom da gravação: <b>${esc(res.key)}</b></span><span class="chip">Andamento: <b>${res.bpm} BPM</b></span>
      <button class="btn sm" data-tempo="half" title="Use se a música for lenta e o andamento parecer o dobro">½ andamento</button><button class="btn sm" data-tempo="double" title="Use se o andamento parecer a metade">2× andamento</button>
      <span class="chip">${res.sections.length} partes</span>${Math.abs(res.tuning)>=10?`<span class="chip">Afinação: <b>${res.tuning>0?'+':''}${res.tuning} cents</b></span>`:''}${res.breaks.length?`<span class="chip">${res.breaks.length} parada(s)</span>`:''}${dec.cut?'<span class="chip">Analisados os primeiros 10 min</span>':''}</div>
    ${lyrBox}
    ${comb||lyrC?`<div class="chips">${lyrC?`<button class="btn sm ${AUD.mode==='letra'?'primary':''}" data-mode="letra">🎤+🎧 Letra transcrita + acordes</button>`:''}${comb?`<button class="btn sm ${AUD.mode==='comb'?'primary':''}" data-mode="comb">📄+🎧 Cifra anexada + gravação</button>`:''}<button class="btn sm ${AUD.mode==='audio'?'primary':''}" data-mode="audio">🎧 Só os acordes</button></div>`:''}
    ${comb&&AUD.mode==='comb'?`
      <div class="info">${comb.semis?`A cifra está em <b>${esc(comb.chartKey)}</b> e a gravação em <b>${esc(res.key)}</b> — transpus a cifra <b>${comb.semis>0?'+':''}${comb.semis}</b>.`:`A cifra (${esc(comb.chartKey||'—')}) está no mesmo tom da gravação.`} O roteiro mostra a ordem das partes nesta versão.</div>`:''}
    ${AUD.mode==='letra'?'<div class="info">Cada acorde está em cima da palavra cantada no momento em que ele soa. Confira a letra: a IA pode errar palavras quando a voz está baixa ou embolada com os instrumentos.</div>':''}
    <div class="ptitle">Partes — toque para ouvir</div>
    <div class="chips" id="audSec">${res.sections.map(s=>`<button class="btn sm" data-t="${s.t}">${esc(s.name)} · ${fmtT(s.t)}</button>`).join('')}</div>
    <div class="ptitle">${AUD.mode==='comb'?'Cifra final (letra da cifra + dados da gravação)':AUD.mode==='letra'?'Cifra completa: letra transcrita + acordes da gravação':'Cifra gerada do áudio'}</div>
    <div class="sheet" style="padding:10px 12px;font-size:14px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px">${renderSheet(view?view.content:res.content,0,false,true)}</div>
    <div class="ptitle">Acordes no tempo — o atual acende enquanto toca</div>
    <div class="tl" id="audTl">${res.segs.map((g,i)=>`<button data-k="${i}" data-t="${g.t0}"><b>${esc(g.c)}</b><small>${fmtT(g.t0)}</small></button>`).join('')}</div>
    <p class="hint">Confira de ouvido: gravações ao vivo com teclado sustentando notas, muitos efeitos ou mixagem densa podem trocar acordes parecidos.</p>`;
  const audio=out.querySelector('#audEl');if(AUD.audio&&AUD.audio!==audio)AUD.audio.pause();AUD.audio=audio;if(t)audio.currentTime=t;if(wasPlaying)audio.play().catch(()=>{});
  const btns=[...out.querySelectorAll('#audTl button')];let cur=-1;
  audio.addEventListener('timeupdate',()=>{const tt=audio.currentTime;let k=res.segs.findIndex(g=>tt>=g.t0&&tt<g.t1);
    if(k!==cur){if(cur>=0&&btns[cur])btns[cur].classList.remove('cur');cur=k;if(k>=0){btns[k].classList.add('cur');btns[k].scrollIntoView({block:'nearest'})}}});
  out.onclick=e=>{
    const md=e.target.closest('[data-mode]');if(md){AUD.mode=md.dataset.mode;drawAudioResult();return}
    const ly=e.target.closest('[data-lyr]');if(ly){const sel=out.querySelector('#lyrLang');startTranscribe(sel?sel.value:'pt');return}
    const tp=e.target.closest('[data-tempo]');if(tp){runAudio(file,tp.dataset.tempo);return}
    const b=e.target.closest('[data-t]');if(!b)return;audio.currentTime=+b.dataset.t;audio.play().catch(()=>{})};
  const foot=document.getElementById('impFoot');
  foot.innerHTML=`<button class="btn" data-i="cancel">Fechar</button><button class="btn primary" data-i="mk">Criar música com essa cifra</button>`;
  foot.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;
    if(b.dataset.i==='cancel'){stopAudio();IMP.m.close();return}
    const L=IMP.link&&(IMP.link.kind==='yt'||IMP.link.kind==='ref')?IMP.link:null;
    const extra={};if(L){extra.links={};extra.links[L.kind==='yt'?'youtube':/spotify/i.test(L.site)?'spotify':'deezer']=L.url}
    const base={title:titleCase(file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ')),key:res.key,bpm:String(res.bpm),
      notes:`Cifra gerada do áudio (${res.bpm} BPM${Math.abs(res.tuning)>=10?`, afinação ${res.tuning>0?'+':''}${res.tuning} cents`:''}) — confira de ouvido e escreva a letra.`,content:res.content};
    if(AUD.mode==='letra')base.notes=`Letra transcrita por IA e acordes tirados do áudio (${res.bpm} BPM) — confira de ouvido.`;
    const r=view?{...base,...view,title:view.title||base.title}:base;
    stopAudio();IMP.m.close();startImported(r,extra);
  };
}

/* ---- Backup ---- */
function backupData(){return JSON.stringify({app:'cifrario',version:1,exported:new Date().toISOString(),songs:Object.values(S.songs),sets:Object.values(S.sets)},null,1)}
function openBackup(){
  const n=Object.keys(S.songs).length,ns=Object.keys(S.sets).length;
  const m=modal(`<div class="mh">Backup</div><div class="mb">
    <p>${n} música${n===1?'':'s'} e ${ns} repertório${ns===1?'':'s'}. ${MODE==='cloud'?'Tudo fica salvo na sua conta do NaNota e aparece em qualquer aparelho onde você entrar.':'Os dados estão salvos apenas neste navegador — faça backups com frequência.'}</p>
    <p>Guarde um arquivo de backup de vez em quando, ou use-o para levar suas cifras para outro lugar.</p>
    <div id="bkOut"></div></div>
    <div class="mf"><button class="btn" data-b="import">Importar backup…</button><button class="btn" data-b="copy">Copiar</button><button class="btn primary" data-b="dl">Baixar .json</button></div>`);
  m.el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-b]');if(!b)return;
    const data=backupData();
    if(b.dataset.b==='import'){m.close();document.getElementById('fileIn').click()}
    if(b.dataset.b==='copy'){
      try{await navigator.clipboard.writeText(data);toast('Backup copiado. Cole num arquivo de texto e salve como .json')}
      catch(_){const o=m.el.querySelector('#bkOut');o.innerHTML='<textarea class="code" style="min-height:160px" readonly></textarea><p class="hint">Selecione tudo e copie.</p>';const ta=o.querySelector('textarea');ta.value=data;ta.select()}
    }
    if(b.dataset.b==='dl'){
      const name='nanota-backup-'+new Date().toISOString().slice(0,10)+'.json';
      if(!DL){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}
      try{await DL.save({filename:name,data})}catch(err){try{await DL.save({filename:name,data:new Blob([data],{type:'application/json'})})}catch(_){toast('Download cancelado ou indisponível — use Copiar.')}}
    }
  });
}
document.getElementById('fileIn').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    const songs=(d.songs||[]).filter(s=>s&&s.id&&typeof s.content==='string');
    const sets=(d.sets||[]).filter(s=>s&&s.id&&Array.isArray(s.items));
    if(!songs.length&&!sets.length) throw 0;
    if(!(await confirmBox(`Importar ${songs.length} música(s) e ${sets.length} repertório(s)? Itens com o mesmo identificador serão substituídos.`,'Importar')))return;
    songs.forEach(s=>persist({...clone(s),type:'song'}));sets.forEach(s=>persist({...clone(s),type:'set'}));
    toast('Backup importado.');render();
  }catch(_){toast('Arquivo inválido — escolha um backup .json do NaNota.')}
});

app.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,i=el.dataset.i!==undefined?+el.dataset.i:null,d=+el.dataset.d||0;
  switch(a){
    case 'tab-library':S.view='library';render();break;
    case 'tab-sets':S.view='sets';render();break;
    case 'theme':S.prefs.theme=S.prefs.theme==='dark'?'light':'dark';savePrefs();render();break;
    case 'backup':openBackup();break;
    case 'account':openAccount();break;
    case 'import':document.getElementById('fileIn').click();break;
    case 'new-song':openEditor(blankSong(),'library');break;
    case 'import-song':openImport('search');break;
    case 'import-audio':openImport('audio');break;
    case 'import-pdf':openImport('pdf');break;
    case 'examples':EX.forEach(x=>persist({...blankSong(),...clone(x)}));render();toast('Exemplos adicionados.');break;
    case 'open-song':{const f=libFiltered();openViewer('library',f.map(s=>s.id),i);break}
    case 'new-set':{const t=new Date();const s={id:uid('r'),type:'set',name:'Novo repertório',date:t.toISOString().slice(0,10),items:[]};persist(s);S.setId=s.id;S.view='set';render();setTimeout(()=>{const n=document.getElementById('setName');if(n){n.focus();n.select()}},0);break}
    case 'open-set':S.setId=el.dataset.id;S.view='set';render();break;
    case 'play-set':{ev.stopPropagation();const set=S.sets[el.dataset.id];if(!set||!set.items.length)return;openViewer('set',set.items.map(x=>x.songId),i||0,set.id);break}
    case 'set-add':openPicker();break;
    case 'noplay':{ev.stopPropagation();const set=S.sets[el.dataset.id];if(!set||!set.items.length)return;openNoPlay(set.id,i||0);break}
    case 'np-exit':exitNoPlay();break;
    case 'np-song':npGoSong(i,true);break;
    case 'np-sec':npGoSec(i,true);break;
    case 'np-prev':npGoSong(NP().cur-1,true);break;
    case 'np-next':npGoSong(NP().cur+1,true);break;
    case 'np-tr':npTranspose(d);break;
    case 'np-font':S.prefs.font=Math.max(12,Math.min(44,S.prefs.font+d));savePrefs();{const y=npKeepScroll();renderNoPlay();y()}break;
    case 'np-chords':S.prefs.showChords=!S.prefs.showChords;savePrefs();{const y=npKeepScroll();renderNoPlay();y()}break;
    case 'set-members':openMembers(S.setId);break;
    case 'set-logs':openLogs(S.setId);break;
    case 'set-leave':leaveGroup(S.setId);break;
    case 'set-del':{const set=S.sets[S.setId];if(await confirmBox(`Excluir o repertório "${set.name}"? As músicas continuam na biblioteca.`)){removeItem(set);S.view='sets';render()}break}
    case 'it-tr':{const set=clone(S.sets[S.setId]);set.items[i].transpose=normSemis((set.items[i].transpose||0)+d);persist(set,700);renderSet();break}
    case 'it-mv':{const set=clone(S.sets[S.setId]);const j=i+d;if(j<0||j>=set.items.length)return;[set.items[i],set.items[j]]=[set.items[j],set.items[i]];persist(set);renderSet();break}
    case 'it-arr':openArrangement(S.setId,i,'set');break;
    case 'it-rm':{const set=clone(S.sets[S.setId]);set.items.splice(i,1);persist(set);renderSet();break}
    // editor
    case 'e-cancel':leaveEdit();break;
    case 'e-save':{readEdit();const E=S.edit,s=E.song;
      if(E.mode==='arr'){
        const set=clone(S.sets[E.setId]);const it=set&&set.items[E.idx];
        if(!it){toast('Repertório não encontrado.');editReturn(E.ret);return}
        if(s.content.trim()===(E.base.content||'').trim())delete it.content;else it.content=s.content;
        if((s.notes||'')===(E.base.notes||''))delete it.notes;else it.notes=s.notes;
        persist(set);toast(it.content!=null||it.notes!=null?'Versão do repertório salva.':'Igual à cifra padrão — nada a personalizar.');
        editReturn(E.ret);return}
      if(!s.title.trim()){toast('Dê um título à música.');document.getElementById('eTitle').focus();return}
      s.title=s.title.trim();s.artist=s.artist.trim();if(!s.key)s.key=detectKey(s.content);
      persist(clone(s));const ret=E.ret,isNew=E.isNew;
      if(isNew&&ret!=='viewer'){S.edit=null;const ids=libFiltered().map(x=>x.id);const k=ids.indexOf(s.id);if(k>=0)openViewer('library',ids,k);else editReturn('library')}
      else editReturn(ret);
      toast('Música salva.');break}
    case 'e-restore':{const E=S.edit;if(!(await confirmBox('Voltar para a cifra padrão neste repertório? As mudanças feitas aqui serão apagadas.','Restaurar')))return;
      const set=clone(S.sets[E.setId]);const it=set.items[E.idx];delete it.content;delete it.notes;persist(set);toast('Cifra padrão restaurada.');editReturn(E.ret);break}
    case 'e-base':{ev.preventDefault();const E=S.edit;if(E.dirty&&!(await confirmBox('Descartar as mudanças desta versão e abrir a cifra padrão?','Abrir padrão')))return;openEditor(E.base,E.ret);break}
    case 'e-blk':openBlk();break;
    case 'e-del':{const s=S.songs[S.edit.song.id];if(s&&await confirmBox(`Excluir "${s.title}"? Ela também sai dos repertórios.`)){
      removeItem(s);Object.values(S.sets).forEach(set=>{if(set.items.some(x=>x.songId===s.id)){const c=clone(set);c.items=c.items.filter(x=>x.songId!==s.id);persist(c)}});
      S.edit=null;S.view='library';render()}break}
    case 'e-tr':{readEdit();const s=S.edit.song;const key=s.key||detectKey(s.content);const f=keyFlat(key,d);
      s.content=transposeText(s.content,d,f);document.getElementById('eContent').value=s.content;
      const ek=document.getElementById('eKey');if(ek&&s.key){s.key=transposeChord(s.key,d,f);ek.value=s.key}
      S.edit.dirty=true;drawPrev();break}
    case 'e-detect':{readEdit();const k=detectKey(S.edit.song.content);if(k){S.edit.song.key=k;document.getElementById('eKey').value=k;S.edit.dirty=true;toast('Tom detectado: '+k+' (pelo primeiro acorde)')}else toast('Nenhum acorde encontrado.');break}
    // viewer
    case 'v-back':{const v=S.viewer;S.view=v.ctx==='set'?'set':'library';if(v.ctx==='set')S.setId=v.setId;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}render();break}
    case 'v-prev':goto(S.viewer.idx-1,'prev');break;
    case 'v-next':goto(S.viewer.idx+1,'next');break;
    case 'v-tr':changeSemis(d);break;
    case 'v-tr0':changeSemis(0,true);break;
    case 'v-font':S.prefs.font=Math.max(12,Math.min(44,S.prefs.font+d));savePrefs();{const sh=document.querySelector('.viewer .sheet');if(sh)sh.style.fontSize=S.prefs.font+'px'}break;
    case 'v-scroll':toggleScroll();break;
    case 'v-speed':S.prefs.speed=Math.max(1,Math.min(15,S.prefs.speed+d));savePrefs();{const l=el.parentElement.querySelector('.lbl');if(l)l.textContent=S.prefs.speed}break;
    case 'v-chords':S.prefs.showChords=!S.prefs.showChords;savePrefs();renderViewer(true);break;
    case 'v-cols':S.prefs.cols=!S.prefs.cols;savePrefs();renderViewer(true);break;
    case 'v-list':{const dr=document.getElementById('drawer');dr.classList.toggle('open');if(dr.classList.contains('open')){drawDrawer();setTimeout(()=>{const q=document.getElementById('dq');q&&q.focus()},50)}break}
    case 'v-jump':{const dr=document.getElementById('drawer');dr.classList.remove('open');const cur=S.viewer.idx;if(i!==cur)goto(i,i>cur?'next':'prev');break}
    case 'v-open-other':{const v=S.viewer;const set=clone(S.sets[v.setId]);const song=S.songs[el.dataset.id];set.items.splice(v.idx+1,0,{songId:song.id,transpose:song.transpose||0});persist(set);v.ids=set.items.map(x=>x.songId);document.getElementById('drawer').classList.remove('open');goto(v.idx+1,'next');toast('Adicionada ao repertório após a atual.');break}
    case 'v-edit':{const v=S.viewer,e=vEntry(v.idx);if(!e||!e.song)break;if(v.ctx==='set'){if(setPerm(S.sets[v.setId],'songs'))openArrangement(v.setId,v.idx,'viewer');else toast('Você não tem permissão para editar as cifras deste repertório.')}else if(canEditSong(e.song))openEditor(e.song,'viewer');break}
    case 'v-full':try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast('Tela cheia indisponível aqui.')}break;
  }
});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ov')||S.view==='auth')return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();quickOpen();return}
  if(S.view==='edit'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();document.querySelector('[data-act=e-save]').click();return}
  if(S.view==='edit'&&e.key==='Escape'){leaveEdit();return}
  if(typing){if(e.key==='Escape')document.activeElement.blur();return}
  if(S.view==='library'&&e.key==='/'){e.preventDefault();const q=document.getElementById('q');q&&q.focus();return}
  if(S.view==='noplay'){npKey(e);return}
  if(S.view!=='viewer')return;
  const dr=document.getElementById('drawer');
  switch(e.key){
    case 'ArrowRight':e.preventDefault();goto(S.viewer.idx+1,'next');break;
    case 'ArrowLeft':e.preventDefault();goto(S.viewer.idx-1,'prev');break;
    case 'PageDown':case 'ArrowDown':e.preventDefault();pageMove(1);break;
    case 'PageUp':case 'ArrowUp':e.preventDefault();pageMove(-1);break;
    case ' ':e.preventDefault();toggleScroll();break;
    case ']':changeSemis(1);break;
    case '[':changeSemis(-1);break;
    case '+':case '=':document.querySelector('[data-act=v-font][data-d="2"]').click();break;
    case '-':document.querySelector('[data-act=v-font][data-d="-2"]').click();break;
    case 'e':case 'E':document.querySelector('[data-act=v-edit]')?.click();break;
    case 'f':case 'F':document.querySelector('[data-act=v-full]').click();break;
    case 'l':case 'L':document.querySelector('[data-act=v-list]').click();break;
    case 'c':case 'C':document.querySelector('[data-act=v-chords]').click();break;
    case 'Escape':if(dr&&dr.classList.contains('open'))dr.classList.remove('open');else document.querySelector('[data-act=v-back]').click();break;
  }
});

render();
initApi();
</script>
</body>
</html>
