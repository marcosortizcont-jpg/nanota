<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaNota — músicas, cifras e repertórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#272c37;--text:#ebe8e3;--muted:#8d95a5;
  --chord:#f5b43c;--accent:#f5b43c;--accentText:#1a1300;--sec:#7cc4ff;--danger:#ff6b6b;--ok:#5fd39a;
  --radius:12px;
}
[data-theme=light]{
  --bg:#f6f4ef;--panel:#ffffff;--panel2:#f0ede6;--line:#e2ddd2;--text:#1c1c1f;--muted:#6c6c74;
  --chord:#b45309;--accent:#d97706;--accentText:#fff;--sec:#1d4ed8;--danger:#c0392b;--ok:#15803d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss03';letter-spacing:-0.005em;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentText);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.icon{padding:6px 10px;min-width:38px}
.btn.on{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],input[type=email],textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.f>input,label.f>select{color:var(--text);font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accentText);font-size:13px;font-family:'JetBrains Mono',monospace}
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs button{background:none;border:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button.act{color:var(--text);background:var(--panel2)}
.top .sp{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.cloud i{background:var(--ok)}

.wrap{max-width:1100px;margin:0 auto;padding:20px 18px 80px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input{flex:1;font-size:16px;padding:11px 14px}
.count{font-size:13px;color:var(--muted);margin:4px 2px 10px}
.hint{font-size:12px;color:var(--muted)}
kbd{font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel2)}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.list li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .12s,transform .08s}
ul.list li:hover{border-color:var(--muted)}
ul.list li:active{transform:scale(.995)}
.li-main{flex:1;min-width:0}
.li-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.key{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--chord);background:color-mix(in srgb,var(--chord) 14%,transparent);border-radius:8px;padding:4px 9px;font-size:14px;min-width:44px;text-align:center}
.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:4px;color:var(--muted)}
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:16px}
.empty h2{margin:0 0 6px;font-size:22px}
.empty p{color:var(--muted);margin:0 0 18px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* set detail */
.sethead{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:14px}
.sethead input.name{font-size:22px;font-weight:700;padding:10px 12px}
.setactions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.item{cursor:default!important}
.item .n{font-family:'JetBrains Mono',monospace;color:var(--muted);width:24px;text-align:right}
.item .grip{cursor:grab;color:var(--muted);font-size:18px;user-select:none;padding:0 2px}
.item.drag{opacity:.4}
.item.over{border-color:var(--accent)!important}
.item .ctl{display:flex;gap:4px;align-items:center}
.item .play{cursor:pointer}

/* editor */
.edit{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:10}
.ebar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.ebar .t{font-weight:600;flex:1}
.ebody{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.ecol{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.ecol+.ecol{border-left:1px solid var(--line);background:var(--panel)}
.egrid{display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:10px}
.etools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
textarea.code{font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.5;flex:1;min-height:360px;resize:vertical;white-space:pre;overflow:auto;tab-size:4}
.ptitle{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* sheet */
.sheet{font-family:'JetBrains Mono',ui-monospace,monospace;line-height:1.35;padding:18px 22px 40px}
.sheet .ch{color:var(--chord);font-weight:700;white-space:pre}
.sheet .ly{white-space:pre-wrap}
.sheet .tab{white-space:pre;color:var(--muted);font-size:.85em}
.sheet .sec{color:var(--sec);font-weight:700;font-family:'Inter',system-ui,sans-serif;margin:.9em 0 .25em;font-size:.85em;text-transform:uppercase;letter-spacing:.06em}
.sheet .gap{height:.8em}
.sheet .pair{break-inside:avoid}
.sheet .cp{display:inline-block;vertical-align:bottom;white-space:pre}
.sheet .cp i{display:block;font-style:normal;color:var(--chord);font-weight:700;padding-right:.35em}
.sheet.nochords .sec{margin-top:1.1em}
.sheet.cols{column-count:2;column-gap:56px;column-rule:1px solid var(--line)}
.sheet .blk{--bc:var(--muted);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:.45em 0;padding:.35em .7em;border-left:3px solid var(--bc);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--bc) 10%,transparent);break-inside:avoid}
.sheet .blk .bt{font-family:'Inter',system-ui,sans-serif;font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--bc)}
.sheet .blk .bd{font-family:'Inter',system-ui,sans-serif;font-size:.85em}
.sheet .blk .bm{color:var(--chord);font-weight:700;white-space:pre}
.b-frase{--bc:#7cc4ff!important}.b-conv{--bc:#f5b43c!important}.b-pass{--bc:#5fd39a!important}.b-vir{--bc:#ff7a7a!important}.b-solo{--bc:#c792ea!important}.b-obs{--bc:#8d95a5!important}.b-gen{--bc:#e0a3ff!important}
[data-theme=light] .b-frase{--bc:#1d4ed8!important}[data-theme=light] .b-conv{--bc:#b45309!important}[data-theme=light] .b-pass{--bc:#15803d!important}[data-theme=light] .b-vir{--bc:#c0392b!important}[data-theme=light] .b-solo{--bc:#7e22ce!important}
.tag.padrao{color:var(--sec);border-color:color-mix(in srgb,var(--sec) 50%,transparent)}
.tag.arr{color:var(--chord);border-color:color-mix(in srgb,var(--chord) 50%,transparent)}
.sheet .note{font-family:'Inter',system-ui,sans-serif;font-size:.8em;color:var(--muted);border-left:3px solid var(--line);padding:4px 10px;margin-bottom:1em;white-space:pre-wrap}

/* viewer / stage */
.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:10}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.vtitle{flex:1;min-width:160px}
.vtitle .t{font-weight:700;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{display:flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px}
.grp .btn{border:none;background:transparent;padding:5px 9px}
.grp .btn:hover{background:var(--panel)}
.grp .btn.on{background:var(--accent);color:var(--accentText)}
.grp .lbl{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:46px;text-align:center;color:var(--chord);font-size:15px}
.grp .lbl.m{color:var(--muted);font-size:12px;min-width:26px}
.vscroll{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
.vscroll .endpad{height:45vh}
.vfoot{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--panel)}
.vfoot button{flex:1;background:none;border:none;padding:12px 14px;display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.vfoot button:disabled{opacity:.3;cursor:default}
.vfoot button+button{border-left:1px solid var(--line);justify-content:flex-end;text-align:right}
.vfoot .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vfoot .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfoot .arr{font-size:22px;color:var(--accent)}
.vpos{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:0 4px}
.anim-next{animation:inR .18s ease-out}
.anim-prev{animation:inL .18s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,90vw);background:var(--panel);border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s}
.drawer.open{transform:none}
.drawer .dh{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.drawer ul{list-style:none;margin:0;padding:8px;overflow:auto;flex:1}
.drawer li{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.drawer li:hover{background:var(--panel2)}
.drawer li.cur{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.drawer li .n{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;width:22px}
.drawer li .k{margin-left:auto;font-family:'JetBrains Mono',monospace;color:var(--chord);font-weight:700;font-size:13px}
.drawer .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 4px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mod .mh{padding:16px 18px 8px;font-weight:700;font-size:18px}
.mod .mb{padding:8px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mod .mf{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mod p{margin:0;color:var(--muted);line-height:1.45}
.pick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pick li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.pick li .li-main{cursor:default}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;animation:fade .15s;max-width:90vw}

.np{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:10}
.np-top .grp .btn{padding:5px 8px}
@media (max-width:640px){.np-set{display:none}.np-top{gap:5px;padding:6px 8px}.np-h .np-t{font-size:17px}.np-strip button{padding:7px 10px}}
.np-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.np-brand{font-weight:800;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:6px}
.np-brand i{font-style:normal;background:var(--accent);color:var(--accentText);border-radius:6px;padding:1px 7px;font-size:13px}
.np-set{color:var(--muted);font-size:14px;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-strip{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.np-strip button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;max-width:240px}
.np-strip button span.n{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px}
.np-strip button span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-strip button span.k{font-family:'JetBrains Mono',monospace;color:var(--chord);font-size:12px}
.np-strip button.on{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.np-strip button.on span{color:var(--accentText)!important}
.np-secs{padding:6px 12px;background:color-mix(in srgb,var(--panel) 70%,var(--bg))}
.np-secs button{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600}
.np-secs button.on{background:var(--sec);border-color:var(--sec);color:#06121c}
.np-body{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;scroll-behavior:auto}
.npsong{padding:6px 0 26px;border-bottom:2px dashed var(--line)}
.np-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px)}
.np-h .np-n{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accentText);background:var(--accent);border-radius:8px;padding:2px 9px;font-size:15px}
.np-h .np-t{font-weight:700;font-size:20px;letter-spacing:-.01em}
.np-h .np-a{font-size:13px;color:var(--muted)}
.np-h .sp{flex:1}
.np-foot{display:flex;border-top:1px solid var(--line);background:var(--panel)}
.np-foot button{flex:1;background:none;border:none;padding:12px 14px;display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.np-foot button+button{border-left:1px solid var(--line);justify-content:flex-end;text-align:right}
.np-foot button:disabled{opacity:.3}
.np-foot .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.np-foot .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-foot .arr{font-size:22px;color:var(--accent)}
.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 35%,transparent)}100%{background:transparent}}
/* importação */
.mod.wide{width:min(760px,100%)}
.itabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.itabs button{white-space:nowrap}
.itabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-weight:500}
.itabs button.act{color:var(--text);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:99px;padding:3px 10px;background:var(--panel2);border:1px solid var(--line)}
.chip b{color:var(--chord)}
.info{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--sec) 10%,transparent);border:1px solid color-mix(in srgb,var(--sec) 30%,transparent)}
.info.warn{background:color-mix(in srgb,var(--chord) 10%,transparent);border-color:color-mix(in srgb,var(--chord) 35%,transparent)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--text)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.box2{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box2 summary{cursor:pointer;font-size:14px}
.tl{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;padding:2px}
.tl button{font-family:'JetBrains Mono',monospace;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:62px}
.tl button b{color:var(--chord);font-size:16px}
.tl button small{color:var(--muted);font-size:10px}
.tl button.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
audio{width:100%}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:4px;color:var(--text)}

.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.authcard{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.authcard h2{margin:0;font-size:20px;text-align:center}
.authcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;text-align:center}
.authcard .btn.primary{padding:12px;font-size:16px}
.ferr{color:var(--danger);font-size:14px;min-height:1.2em;text-align:center}
.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ulist li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{font-size:11px;border-radius:99px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.badge.warn{color:var(--chord);border-color:color-mix(in srgb,var(--chord) 50%,transparent)}
.badge.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.sm-sel{width:auto!important;padding:5px 8px!important;font-size:13px}

@media (max-width:820px){
  .toolbar{flex-wrap:wrap}
  .toolbar input{flex:1 1 100%}
  #uAdd{grid-template-columns:1fr 1fr!important}
  #uAdd button{grid-column:1/-1}
  .ebody{grid-template-columns:1fr}
  .ecol+.ecol{border-left:none;border-top:1px solid var(--line)}
  .egrid{grid-template-columns:1fr 1fr}
  .sheet.cols{column-count:1}
  .tabs{margin-left:0}
  .top .in{flex-wrap:wrap;gap:8px}
  .status span{display:none}
  .sethead{grid-template-columns:1fr}
  .vbar .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
"use strict";
/* ============ Música: acordes e transposição ============ */
const NOTES_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const FLAT_KEYS=new Set(['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm']);
const CHORD_RE=/^[A-G][#b]?(?:maj|min|dim|aug|sus|add|[mM°º+\-]|[0-9]|[#b]|\(|\)|\/(?=[0-9#b+\-]))*(?:\/[A-G][#b]?)?$/;
const IGNORE_RE=/^(\|+|-+|\/|%|\.{2,}|x\d+|\d+x|\(\d*x\d*\)|\(|\)|:|\*+)$/i;

function isChord(t){return !!t && CHORD_RE.test(t)}
function tokInfo(t){const m=t.match(/^([(\[]*)(.*?)([)\],.;]*)$/);return {pre:m[1],core:m[2],post:m[3]}}
function isChordLine(line){
  const toks=line.trim().split(/\s+/);
  if(!toks[0]) return false;
  let n=0;
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(i===0 && toks.length>1 && (/^\[[^\]]+\]$/.test(t) || (/:$/.test(t) && !isChord(t.slice(0,-1))))) continue;
    if(IGNORE_RE.test(t)) continue;
    const {core}=tokInfo(t);
    if(!core) continue;
    if(isChord(core)){n++;continue}
    return false;
  }
  return n>0;
}
function trNote(n,s,flat){const i=IDX[n];if(i===undefined)return n;return (flat?NOTES_F:NOTES_S)[((i+s)%12+12)%12]}
function transposeChord(ch,s,flat){
  if(!s) return ch;
  const m=ch.match(/^([A-G][#b]?)(.*)$/); if(!m) return ch;
  let rest=m[2],bass='';
  const b=rest.match(/^(.*)\/([A-G][#b]?)$/); if(b){rest=b[1];bass=b[2]}
  return trNote(m[1],s,flat)+rest+(bass?'/'+trNote(bass,s,flat):'');
}
function transposeToken(t,s,flat){const {pre,core,post}=tokInfo(t);return isChord(core)?pre+transposeChord(core,s,flat)+post:t}
function transposeChordLine(line,s,flat){
  if(!s) return line;
  let out='';
  line.replace(/\S+/g,(tok,idx)=>{
    if(out.length<idx) out+=' '.repeat(idx-out.length);
    else if(out.length && out[out.length-1]!==' ') out+=' ';
    out+=transposeToken(tok,s,flat);
    return tok;
  });
  return out;
}
function normSemis(s){s=((s%12)+12)%12;return s>6?s-12:s}
function keyFlat(key,s){if(!key)return false;return FLAT_KEYS.has(transposeChord(key,s,true))}
function keyAt(key,s){if(!key)return '';const f=keyFlat(key,s);return transposeChord(key,s,f)}
function detectKey(content){
  for(const line of (content||'').split('\n')){
    let c=null;
    if(isChordLine(line)){
      for(const t of line.trim().split(/\s+/)){const {core}=tokInfo(t);if(isChord(core)){c=core;break}}
    }else{const m=line.match(/\[([^\]]+)\]/g);if(m)for(const x of m){if(isChord(x.slice(1,-1))){c=x.slice(1,-1);break}}}
    if(c){const r=c.match(/^([A-G][#b]?)(m(?!aj))?/);return r[1]+(r[2]?'m':'')}
  }
  return '';
}
/* Transpõe o texto inteiro (usado no editor para "gravar" o novo tom) */
function transposeText(content,s,flat){
  return content.split('\n').map(line=>{
    const b=line.match(BLK_RE);
    if(b){const i=line.indexOf('||');return i<0?line:line.slice(0,i+2)+transposeChordLine(line.slice(i+2),s,flat)}
    if(isChordLine(line)) return transposeChordLine(line,s,flat);
    return line.replace(/\[([^\]]+)\]/g,(m,c)=>isChord(c)?'['+transposeChord(c,s,flat)+']':m);
  }).join('\n');
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* Blocos: "@Convenção: descrição || G  D/F#  Em" */
const BLK_RE=/^\s*@([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9 ºª.\-]{0,24}):\s?(.*)$/;
const BLK_TYPES=['Frase','Convenção','Passagem','Virada','Riff','Solo','Intro','Final','Dinâmica','Observação'];
function blkClass(t){t=norm(t);if(t.startsWith('frase'))return 'b-frase';if(t.startsWith('conven'))return 'b-conv';if(t.startsWith('passag'))return 'b-pass';
  if(t.startsWith('virad'))return 'b-vir';if(t.startsWith('riff')||t.startsWith('solo'))return 'b-solo';if(t.startsWith('obs')||t.startsWith('dinam'))return 'b-obs';return 'b-gen'}
function parseBlk(line){const m=line.match(BLK_RE);if(!m)return null;const i=m[2].indexOf('||');
  return {type:m[1].trim(),desc:(i<0?m[2]:m[2].slice(0,i)).trim(),music:i<0?'':m[2].slice(i+2).replace(/^\s+/,'')}}
function blkHTML(b,s,flat,show){
  return `<div class="blk ${blkClass(b.type)}"><span class="bt">${esc(b.type)}</span>${b.desc?`<span class="bd">${esc(b.desc)}</span>`:''}${b.music&&show?`<span class="bm">${esc(transposeChordLine(b.music,s,flat))}</span>`:''}</div>`;
}
function classify(line){
  if(!line.trim()) return 'gap';
  if(BLK_RE.test(line)) return 'blk';
  const br=line.match(/^\s*\[([^\]]+)\]\s*$/);
  if(br && !isChord(br[1].trim())) return 'sec';
  if(/\[[^\]]+\]/.test(line) && (line.match(/\[([^\]]+)\]/g)||[]).some(x=>isChord(x.slice(1,-1)))) return 'cp';
  if(isChordLine(line)) return 'ch';
  if(/^\s*[A-Za-zÀ-ÿ0-9ºª.\- ]{2,28}:\s*$/.test(line)) return 'sec';
  if(/^\s*[eBGDAEbgda]\s*\|[-0-9hpb\/\\|~x ]*$/.test(line) && /-{3,}/.test(line)) return 'tab';
  return 'ly';
}
function cpHTML(line,s,flat,show){
  const parts=line.split(/(\[[^\]]+\])/);let html='',pend=null;
  const flush=()=>{if(pend!==null){html+=`<span class="cp"><i>${esc(pend)}</i> </span>`;pend=null}};
  for(const p of parts){
    if(!p) continue;
    const m=p.match(/^\[([^\]]+)\]$/);
    if(m && isChord(m[1])){ if(!show) continue; flush(); pend=transposeChord(m[1],s,flat); continue; }
    if(pend!==null){html+=`<span class="cp"><i>${esc(pend)}</i>${esc(p)}</span>`;pend=null}
    else html+=esc(p);
  }
  flush();
  return html||' ';
}
function renderSheet(content,s,flat,show){
  const lines=(content||'').replace(/\r/g,'').split('\n');
  let html='';
  for(let i=0;i<lines.length;i++){
    const line=lines[i],t=classify(line);
    if(t==='gap'){html+='<div class="gap"></div>';continue}
    if(t==='blk'){html+=blkHTML(parseBlk(line),s,flat,show);continue}
    if(t==='sec'){html+=`<div class="sec">${esc(line.trim().replace(/^\[|\]$|:$/g,''))}</div>`;continue}
    if(t==='tab'){if(show)html+=`<div class="tab">${esc(line)}</div>`;continue}
    if(t==='cp'){html+=`<div class="ly${show?' cpl':''}">${cpHTML(line,s,flat,show)}</div>`;continue}
    if(t==='ch'){
      if(!show) continue;
      const ch=`<div class="ch">${esc(transposeChordLine(line,s,flat))}</div>`;
      const nx=lines[i+1];
      if(nx!==undefined && classify(nx)==='ly'){html+=`<div class="pair">${ch}<div class="ly">${esc(nx)}</div></div>`;i++}
      else html+=ch;
      continue;
    }
    html+=`<div class="ly">${esc(line)}</div>`;
  }
  return html;
}

/* ============ Estado e armazenamento ============ */
let LS_KEY='nanota.data.anon'; const PREF_KEY='nanota.prefs.v1';
const S={songs:{},sets:{},view:'library',q:'',setQ:'',setId:null,viewer:null,edit:null,
  prefs:{font:20,showChords:true,cols:false,speed:4,theme:'dark'}};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
(function(){const d=lsGet(LS_KEY);if(d){S.songs=d.songs||{};S.sets=d.sets||{}}const p=lsGet(PREF_KEY);if(p)Object.assign(S.prefs,p)})();
function savePrefs(){lsSet(PREF_KEY,S.prefs)}
function saveLocal(){lsSet(LS_KEY,{songs:S.songs,sets:S.sets})}

let COL=null,DL=null,MODE='local',loaded=false;
const queues={};
function queue(id,fn){const p=(queues[id]||Promise.resolve()).catch(()=>{}).then(fn);queues[id]=p;return p}
function writeErr(e){
  const c=e&&e.code;
  if(c==='session')return;
  if(c==='other'){toast(e.message||'Não consegui salvar.');return}
  if(c==='quota_exceeded') toast('Limite de armazenamento atingido — exclua músicas antigas ou faça backup.');
  else if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){COL=null;MODE='local';updateStatus();toast('Sem permissão para salvar na conta — salvando só neste navegador.')}
  else toast('Não consegui salvar agora. Tente de novo em instantes.');
}
function cloudSet(item){
  if(!COL) return;
  const body=JSON.parse(JSON.stringify(item));
  queue(item.id,()=>COL.doc(item.id).set(body).catch(e=>{
    if(e&&e.code==='unavailable') return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>COL&&COL.doc(item.id).set(body));
    throw e;
  })).catch(writeErr);
}
const timers={};
function persist(item,delay){
  item.updated=Date.now();
  (item.type==='set'?S.sets:S.songs)[item.id]=item;
  saveLocal();
  clearTimeout(timers[item.id]);
  delete timers[item.id];
  if(delay) timers[item.id]=setTimeout(()=>{delete timers[item.id];cloudSet(item)},delay); else cloudSet(item);
}
function removeItem(item){
  delete (item.type==='set'?S.sets:S.songs)[item.id];
  saveLocal();clearTimeout(timers[item.id]);
  if(COL) queue(item.id,()=>COL.doc(item.id).delete()).catch(writeErr);
}
function uid(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}

async function initCloud(){
  if(!window.claude||typeof claude.use!=='function') return;
  try{ claude.use('downloads').then(d=>{DL=d}).catch(()=>{}); }catch(e){}
  let db,user;
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){return}
  if(!db||!user) return;
  let id=null;try{id=await user.id()}catch(e){}
  if(!id) return;
  COL=db.collection('data/users/'+id);
  MODE='loading';updateStatus();
  const timer=setTimeout(()=>{if(!loaded){MODE='local';updateStatus();toast('Ainda não conectei à sua conta — mostrando a cópia deste navegador.')}},10000);
  let migrated=false;
  COL.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){
      clearTimeout(timer);
      if(!loaded){
        loaded=true;
        if(snap.empty && !migrated){
          migrated=true;
          const local=lsGet(LS_KEY)||{};
          const items=[...Object.values(local.songs||{}),...Object.values(local.sets||{})];
          if(items.length){MODE='cloud';updateStatus();items.forEach(it=>cloudSet(it));return}
        }
      }
      MODE='cloud';
    }else if(!loaded && snap.empty) return;
    const songs={},sets={};
    snap.docs.forEach(d=>{const x=d.data();if(!x)return;if(x.type==='song')songs[d.id]=x;else if(x.type==='set')sets[d.id]=x});
    S.songs=songs;S.sets=sets;saveLocal();
    updateStatus();onData();
  },err=>{clearTimeout(timer);COL=null;MODE='local';updateStatus()});
}

/* ============ Conta NaNota (servidor Cloudflare) ============ */
let PLAN=null;
const VER={};
async function api(method,path,data){
  let r;
  try{r=await fetch(path,{method,credentials:'same-origin',headers:{'content-type':'application/json','x-nanota':'1'},body:data===undefined?undefined:JSON.stringify(data)})}
  catch(e){const x=new Error('Sem conexão com o servidor.');x.status=0;throw x}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const x=new Error(j.error||('Erro '+r.status));x.status=r.status;throw x}
  return j;
}
function mapErr(e){
  if(e.status===401){showLogin('Sua sessão expirou. Entre de novo.');throw {code:'session'}}
  if(e.status===403){showChangePw(true);throw {code:'session'}}
  if(e.status===413)throw {code:'quota_exceeded'};
  if(e.status===402){toast(e.message);setTimeout(()=>loadData(),400);throw {code:'session'}}
  if(e.status===403&&/padrão|permissão|dono/.test(e.message)){toast(e.message);setTimeout(bgRefresh,300);throw {code:'session'}}
  if(e.status===409){toast(e.message);setTimeout(bgRefresh,200);throw {code:'session'}}
  if(!e.status||e.status>=500)throw {code:'unavailable'};
  throw {code:'other',message:e.message};
}
const APICOL={doc:id=>{
  const base=String(id).startsWith('r-')?'/api/sets/':'/api/songs/';
  return {
    set:b=>{
      if(b.type!=='set')return api('PUT','/api/songs/'+encodeURIComponent(id),b).catch(mapErr);
      const body={...b,version:VER[id]};delete body.group;
      return api('PUT','/api/sets/'+encodeURIComponent(id),body).then(r=>{if(r&&r.version){VER[id]=r.version;if(S.sets[id])S.sets[id].version=r.version}return r}).catch(mapErr);
    },
    delete:()=>api('DELETE',base+encodeURIComponent(id)).catch(mapErr)
  };
}};
function useUserCache(){LS_KEY='nanota.data.'+ME.id}
let bgTimer=null;
function applyData(d){
  const songs={},sets={};d.songs.forEach(s=>songs[s.id]=s);d.sets.forEach(s=>{sets[s.id]=s;VER[s.id]=s.version});
  S.songs=songs;S.sets=sets;saveLocal();
}
async function bgRefresh(){
  if(!ME||MODE!=='cloud'||S.view==='edit'||S.view==='auth'||document.querySelector('.ov')||Object.keys(timers).length)return;
  try{
    await Promise.all(Object.values(queues).map(p=>p.catch(()=>{})));
    const d=await api('GET','/api/data');
    if(S.view==='edit'||S.view==='auth')return;
    applyData(d);onData();
  }catch(e){if(e.status===401)showLogin('Sua sessão expirou. Entre de novo.')}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)bgRefresh()});
async function initApi(){
  const tok=new URLSearchParams(location.search).get('convite');
  if(tok) return showInvite(tok);
  try{const r=await api('GET','/api/me');ME=r.user;PLAN=r.plan}
  catch(e){
    if(e.status===401) return showLogin();
    authScreen('<h2>Sem conexão</h2><p>Não consegui falar com o servidor do NaNota. Verifique a internet e tente de novo.</p><button class="btn primary" onclick="location.reload()">Tentar de novo</button>');
    return;
  }
  useUserCache();
  if(ME.mustChangePassword) return showChangePw(true);
  await loadData();
}
async function loadData(){
  const cache=lsGet(LS_KEY);
  if(cache){S.songs=cache.songs||{};S.sets=cache.sets||{}}
  S.view=S.view==='auth'?'library':S.view;MODE='loading';render();
  try{
    const d=await api('GET','/api/data');
    applyData(d);COL=APICOL;MODE='cloud';
    if(!bgTimer)bgTimer=setInterval(()=>{if(!document.hidden)bgRefresh()},30000);
    const back=new URLSearchParams(location.search).get('voltar');
    if(back&&/^\/[a-z0-9-]+\.html$/.test(back)){location.href=back;return}
    if(location.hash==='#repertorios'){S.view='sets';history.replaceState(null,'','/')}
    render();
  }catch(e){
    if(e.status===401) return showLogin();
    if(e.status===403) return showChangePw(true);
    MODE='local';updateStatus();toast('Sem conexão — mostrando a cópia deste aparelho (somente leitura até reconectar).');
  }
}
function authScreen(html){
  S.view='auth';stopScroll();
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  app.innerHTML=`<div class="auth"><form class="authcard" id="authForm" autocomplete="on"><div class="logo" style="justify-content:center"><span class="dot">♯</span>NaNota</div>${html}</form></div>`;
  return document.getElementById('authForm');
}
function busy(f,on){f.querySelectorAll('button,input').forEach(x=>x.disabled=on)}
function showLogin(msg){
  ME=null;COL=null;S.songs={};S.sets={};
  const f=authScreen(`<h2>Entrar</h2>${msg?`<p>${esc(msg)}</p>`:''}
    <label class="f">E-mail<input type="email" name="email" id="lgE" autocomplete="username" required></label>
    <label class="f">Senha<input type="password" name="password" id="lgP" autocomplete="current-password" required></label>
    <div class="ferr" id="fErr"></div>
    <button class="btn primary" type="submit">Entrar</button>
    <p>Não tem acesso? Peça um convite ao administrador.</p>`);
  setTimeout(()=>document.getElementById('lgE').focus(),30);
  f.onsubmit=async ev=>{ev.preventDefault();const er=document.getElementById('fErr');er.textContent='';busy(f,true);
    try{
      ME=(await api('POST','/api/login',{email:document.getElementById('lgE').value,password:document.getElementById('lgP').value})).user;
      useUserCache();
      if(ME.mustChangePassword) return showChangePw(true);
      S.view='library';await loadData();
    }catch(e){er.textContent=e.message;busy(f,false);document.getElementById('lgP').select()}};
}
function showChangePw(forced){
  const f=authScreen(`<h2>${forced?'Crie sua senha':'Trocar senha'}</h2>
    ${forced?'<p>Você entrou com uma senha temporária. Escolha uma senha só sua para continuar.</p>':''}
    <label class="f">Senha atual${forced?' (temporária)':''}<input type="password" id="cpC" autocomplete="current-password" required></label>
    <label class="f">Nova senha (mínimo 6 caracteres)<input type="password" id="cpN" autocomplete="new-password" minlength="6" required></label>
    <label class="f">Repita a nova senha<input type="password" id="cpR" autocomplete="new-password" minlength="6" required></label>
    <div class="ferr" id="fErr"></div>
    <button class="btn primary" type="submit">Salvar senha</button>
    ${forced?'<button class="btn ghost" type="button" id="cpOut">Sair</button>':'<button class="btn ghost" type="button" id="cpBack">Cancelar</button>'}`);
  setTimeout(()=>document.getElementById('cpC').focus(),30);
  const out=document.getElementById('cpOut');if(out)out.onclick=logout;
  const back=document.getElementById('cpBack');if(back)back.onclick=()=>{S.view='library';render()};
  f.onsubmit=async ev=>{ev.preventDefault();const er=document.getElementById('fErr');er.textContent='';
    const n=document.getElementById('cpN').value;
    if(n!==document.getElementById('cpR').value){er.textContent='As senhas novas não são iguais.';return}
    busy(f,true);
    try{await api('POST','/api/password',{current:document.getElementById('cpC').value,password:n});
      ME.mustChangePassword=false;toast('Senha salva.');S.view='library';await loadData();
    }catch(e){er.textContent=e.message;busy(f,false)}};
}
async function showInvite(tok){
  let inv;
  try{inv=await api('GET','/api/invite?token='+encodeURIComponent(tok))}
  catch(e){const f=authScreen(`<h2>Link inválido</h2><p>${esc(e.message)}</p><button class="btn primary" type="submit">Ir para o login</button>`);
    f.onsubmit=ev=>{ev.preventDefault();history.replaceState(null,'','/');showLogin()};return}
  const reset=inv.purpose==='reset';
  const f=authScreen(`<h2>${reset?'Nova senha':'Bem-vindo ao NaNota'}</h2>
    <p>${reset?'Defina uma nova senha para':'Crie sua senha para entrar como'} <b>${esc(inv.email)}</b>.</p>
    <input type="email" value="${esc(inv.email)}" autocomplete="username" hidden readonly>
    ${reset?'':`<label class="f">Seu nome<input type="text" id="ivN" value="${esc(inv.name||'')}" autocomplete="name"></label>`}
    <label class="f">Senha (mínimo 6 caracteres)<input type="password" id="ivP" autocomplete="new-password" minlength="6" required></label>
    <label class="f">Repita a senha<input type="password" id="ivR" autocomplete="new-password" minlength="6" required></label>
    <div class="ferr" id="fErr"></div>
    <button class="btn primary" type="submit">${reset?'Salvar e entrar':'Criar senha e entrar'}</button>`);
  f.onsubmit=async ev=>{ev.preventDefault();const er=document.getElementById('fErr');er.textContent='';
    const p=document.getElementById('ivP').value;
    if(p!==document.getElementById('ivR').value){er.textContent='As senhas não são iguais.';return}
    busy(f,true);
    try{const n=document.getElementById('ivN');
      ME=(await api('POST','/api/invite',{token:tok,password:p,name:n?n.value:''})).user;
      history.replaceState(null,'','/');useUserCache();S.view='library';await loadData();toast('Pronto! Você está dentro.');
    }catch(e){er.textContent=e.message;busy(f,false)}};
}
async function logout(){
  try{await api('POST','/api/logout')}catch(e){}
  try{localStorage.removeItem(LS_KEY)}catch(e){}
  LS_KEY='nanota.data.anon';showLogin();
}
function roleLabel(u){return u.is_master||u.isMaster?'Master':u.role==='admin'?'Administrador':'Membro'}
function money(c,i){if(!c)return 'Grátis';const v=(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});return v+(i==='month'?'/mês':i==='year'?'/ano':'')}
async function openAccount(){
  try{const r=await api('GET','/api/me');ME=r.user;PLAN=r.plan}catch(e){}
  const m=modal(`<div class="mh">${esc(ME.name||'Minha conta')}</div><div class="mb">

/* ---- Transcrição da letra (servidor: Whisper) ---- */
async function resample16(x,sr){
  const SR=16000;if(sr===SR)return x;
  const n=Math.ceil(x.length*SR/sr);
  try{const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const ctx=new AC(1,n,SR);const b=ctx.createBuffer(1,x.length,sr);b.getChannelData(0).set(x);
    const src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);src.start();
    const r=await ctx.startRendering();return r.getChannelData(0)}
  catch(e){const y=new Float32Array(n),k=sr/SR;for(let i=0;i<n;i++){const p=i*k,j=Math.floor(p),f=p-j;y[i]=(x[j]||0)*(1-f)+(x[j+1]||0)*f}return y}
}
function cutChunks(y,SR){
  // pedaços de ~28 s, cortados no ponto mais silencioso entre 22 e 30 s (para não partir palavras)
  const hop=SR*0.05,out=[];let a=0;const N=y.length;
  while(a<N){
    if(N-a<=SR*32){out.push([a,N]);break}
    let best=a+SR*28,bv=Infinity;
    for(let p=a+SR*22;p+hop<=a+SR*30;p+=hop){let s=0;for(let i=p;i<p+hop;i++)s+=y[i]*y[i];if(s<bv){bv=s;best=p+hop/2}}
    best=Math.round(best);out.push([a,best]);a=best}
  return out.filter(([a,b])=>b-a>SR*0.8);
}
function wavB64(seg,SR){
  let peak=1e-6;for(let i=0;i<seg.length;i++){const v=Math.abs(seg[i]);if(v>peak)peak=v}
  const g=Math.min(4,0.95/peak); // normaliza o volume
  const buf=new ArrayBuffer(44+seg.length*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+seg.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,seg.length*2,true);
  for(let i=0;i<seg.length;i++){const s=Math.max(-1,Math.min(1,seg[i]*g));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}
  const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(s);
}
async function transcribeAudio(dec,opts){
  opts=opts||{};const SR=16000;
  const y=await resample16(dec.x,dec.sr);
  const chunks=cutChunks(y,SR);if(!chunks.length)return [];
  const res=new Array(chunks.length);let done=0,next=0,fatal=null;
  const one=async k=>{const [a,b]=chunks[k];const audio=wavB64(y.subarray(a,b),SR);
    for(let tr=0;tr<3;tr++){
      try{const r=await api('POST','/api/transcribe',{audio,lang:opts.lang||'pt',prompt:opts.prompt||''});
        res[k]=(r.words||[]).map(w=>({...w,s:w.s+a/SR,e:w.e+a/SR}));return}
      catch(e){if(e.status===401){mapErr(e);throw e}if(e.status&&e.status<500&&e.status!==429)throw e;if(e.status===429)throw e;
        if(tr===2)throw e;await new Promise(r=>setTimeout(r,1200*(tr+1)))}}};
  const worker=async()=>{while(next<chunks.length&&!fatal){const k=next++;try{await one(k)}catch(e){fatal=e;return}done++;opts.onProg&&opts.onProg(done/chunks.length)}};
  await Promise.all([worker(),worker(),worker()]);
  if(fatal)throw fatal;
  // junta, sem palavras repetidas na emenda dos pedaços
  const all=[];res.forEach(ws=>(ws||[]).forEach(w=>{const l=all[all.length-1];if(l&&w.s<l.e-0.05&&w.w.toLowerCase()===l.w.toLowerCase())return;all.push(w)}));
  return all;
}

/* ============ Utilidades de UI ============ */
const app=document.getElementById('app');
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html){
  const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="mod">${html}</div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener('keydown',k)};
  const k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};
  document.addEventListener('keydown',k);
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  return {el:ov,close};
}
function confirmBox(msg,ok='Excluir'){
  return new Promise(res=>{
    const m=modal(`<div class="mh">Confirmar</div><div class="mb"><p>${esc(msg)}</p></div><div class="mf"><button class="btn" data-x="0">Cancelar</button><button class="btn primary" data-x="1">${esc(ok)}</button></div>`);
    m.el.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b){m.close();res(b.dataset.x==='1')}});

  });

function songsSorted(){return Object.values(S.songs).filter(x=>!x.shared).sort((a,b)=>(a.title||'').localeCompare(b.title||'','pt',{sensitivity:'base'}))}
function norm(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function matches(song,q){
  if(!q) return true;
  const hay=norm([song.title,song.artist,(song.tags||[]).join(' '),song.key].join(' '));
  const terms=norm(q).split(/\s+/).filter(Boolean);
  return terms.every(t=>hay.includes(t)) || norm(song.content).includes(norm(q));
}

function drawDrawer(q){
  const d=document.getElementById('drawer');if(!d)return;const v=S.viewer;
  q=q||'';
  const lst=v.ids.map((id,i)=>({i,s:S.songs[id],e:vEntry(i)})).filter(x=>x.s&&matches(x.s,q));
  const others=q&&v.ctx==='set'?songsSorted().filter(s=>!v.ids.includes(s.id)&&matches(s,q)).slice(0,30):[];
  d.innerHTML=`<div class="dh"><input type="search" id="dq" placeholder="Pular para…" value="${esc(q)}" autocomplete="off"><button class="btn icon" data-act="v-list">✕</button></div>
  <ul>${v.ctx==='set'?'<div class="sub">Repertório</div>':''}${lst.map(x=>`<li class="${x.i===v.idx?'cur':''}" data-act="v-jump" data-i="${x.i}"><span class="n">${x.i+1}</span><span class="li-main"><div class="li-t">${esc(x.s.title)}</div><div class="li-a">${esc(x.s.artist||'')}</div></span><span class="k">${x.s.key?esc(keyAt(x.s.key,x.e.semis)):''}</span></li>`).join('')}
  ${others.length?'<div class="sub">Outras da biblioteca</div>'+others.map(s=>`<li data-act="v-open-other" data-id="${s.id}"><span class="n">+</span><span class="li-main"><div class="li-t">${esc(s.title)}</div><div class="li-a">${esc(s.artist||'')}</div></span><span class="k">${s.key?esc(keyAt(s.key,s.transpose||0)):''}</span></li>`).join(''):''}</ul>`;
  const dq=d.querySelector('#dq');
  dq.addEventListener('input',()=>{const pos=dq.selectionStart;drawDrawer(dq.value);const n=document.getElementById('dq');n.focus();n.setSelectionRange(pos,pos)});
  dq.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=d.querySelector('li[data-act]');if(f)f.click()}});
}
function goto(i,dir){
  const v=S.viewer;if(i<0||i>=v.ids.length)return;
  v.idx=i;v.dir=dir||'';stopScroll(true);renderViewer();
  const sc=document.getElementById('vscroll');if(sc)sc.scrollTop=0;
}
function changeSemis(d,reset){
  if(S.viewer&&S.viewer.ctx==='set'&&!setPerm(S.sets[S.viewer.setId],'transpose')){toast('Você não tem permissão para mudar o tom neste repertório.');return}
  const v=S.viewer,e=vEntry(v.idx);if(!e||!e.song)return;
  const ns=reset?0:normSemis(e.semis+d);
  if(v.ctx==='set'){const set=clone(S.sets[v.setId]);set.items[v.idx].transpose=ns;persist(set,700)}
  else{const s=clone(e.song);s.transpose=ns;if(canEditSong(e.song))persist(s,700);else{S.songs[s.id]=s;saveLocal()}}
  refreshViewer();
}
function startScroll(){
  stopScroll();scrollOn=true;
  let last=performance.now(),acc=0;
  const step=t=>{
    const sc=document.getElementById('vscroll');if(!sc||!scrollOn){scrollRAF=null;return}
    const dt=(t-last)/1000;last=t;acc+=dt*S.prefs.speed*9;
    if(acc>=1){const px=Math.floor(acc);acc-=px;sc.scrollTop+=px}
    if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2){scrollOn=false;scrollRAF=null;const b=document.querySelector('[data-act=v-scroll]');if(b){b.classList.remove('on');b.textContent='▶'}return}
    scrollRAF=requestAnimationFrame(step);
  };
  scrollRAF=requestAnimationFrame(step);
}
function stopScroll(keepFlag){if(scrollRAF)cancelAnimationFrame(scrollRAF);scrollRAF=null;if(!keepFlag)scrollOn=false;else scrollOn=false}
function toggleScroll(){
  if(scrollOn){stopScroll()}else{startScroll()}
  const b=document.querySelector('[data-act=v-scroll]');if(b){b.classList.toggle('on',scrollOn);b.textContent=scrollOn?'❚❚':'▶'}
}
function bindSwipe(){
  const sc=document.getElementById('vscroll');if(!sc)return;let x0=null,y0=null,t0=0;
  sc.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now()},{passive:true});
  sc.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Date.now()-t0<600 && Math.abs(dx)>70 && Math.abs(dy)<60){dx<0?goto(S.viewer.idx+1,'next'):goto(S.viewer.idx-1,'prev')}},{passive:true});
}
function pageMove(dir){
  const sc=document.getElementById('vscroll');if(!sc)return;
  const atEnd=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-sc.clientHeight*0.45-4;
  if(dir>0){ if(atEnd) goto(S.viewer.idx+1,'next'); else sc.scrollBy({top:sc.clientHeight*0.75,behavior:'smooth'}) }
  else{ if(sc.scrollTop<=2) goto(S.viewer.idx-1,'prev'); else sc.scrollBy({top:-sc.clientHeight*0.75,behavior:'smooth'}) }
}

function npAnchors(){

function npSync(force){
  const np=S.np,body=document.getElementById('vscroll');if(!body)return;
  const hd=document.querySelector('.np-h');const y=body.scrollTop+(hd?hd.offsetHeight:56)+14;let cur=0;

  const songChanged=cur!==np.cur||force;
  np.cur=cur;np.sec=sec;
  if(songChanged){
    document.querySelectorAll('#npSongs button').forEach((b,i)=>b.classList.toggle('on',i===cur));
    const on=document.querySelector('#npSongs button.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
    document.getElementById('npSecs').innerHTML=an.map((a,k)=>`<button class="btn sm" data-act="np-sec" data-i="${k}" title="${k<9?'Setas ↑ ↓ ou pedal':''}">${esc(a.name)}</button>`).join('')||'';
    const set=S.sets[np.setId],e=npEntry(set,cur);const kEl=document.getElementById('npKey');
    if(kEl)kEl.textContent=e&&e.song.key?keyAt(e.song.key,e.semis):(e?(e.semis>0?'+':'')+e.semis:'—');
    const nm=i=>{const it=set.items[i];const s=it&&S.songs[it.songId];return s?`${i+1}. ${s.title}${s.key?' · '+keyAt(s.key,it.transpose||0):''}`:'—'};
    document.getElementById('npPrevN').textContent=cur>0?nm(cur-1):'—';document.getElementById('npPrev').disabled=cur<=0;
    document.getElementById('npNextN').textContent=cur<set.items.length-1?nm(cur+1):'Fim do repertório';document.getElementById('npNext').disabled=cur>=set.items.length-1;
  }
  document.querySelectorAll('#npSecs button').forEach((b,k)=>b.classList.toggle('on',k===sec));
  const so=document.querySelector('#npSecs button.on');if(so&&songChanged)so.scrollIntoView({block:'nearest',inline:'nearest'});
}
function npScrollTo(el,flash){
  const body=document.getElementById('vscroll');if(!body||!el)return;
  const song=el.closest('.npsong'),hd=song&&song.querySelector('.np-h');
  const head=el.classList.contains('npsong')?0:(hd?hd.offsetHeight+8:56);
  body.scrollTop=Math.max(0,el.offsetTop-head);
  const fl=el.classList.contains('npsong')?el.querySelector('.np-h'):el;
  if(flash&&fl){fl.classList.remove('flash');void fl.offsetWidth;fl.classList.add('flash')}
  npSync(true);
}
function npGoSong(i,flash){const np=S.np;if(!np||i<0||i>=np.anchors.length)return;const a=np.anchors[i][0];if(a)npScrollTo(a.el,flash)}
function npGoSec(k,flash){const np=S.np,an=np.anchors[np.cur]||[];if(!an[k])return;npScrollTo(an[k].el,flash&&k>0)}
function npStep(dir){
  const np=S.np,an=np.anchors[np.cur]||[];
  if(dir>0){if(np.sec+1<an.length)npGoSec(np.sec+1,true);else npGoSong(np.cur+1,true)}
  else{const body=document.getElementById('vscroll');const a=an[np.sec];
    if(a&&body.scrollTop-(a.el.offsetTop-70)>40)npGoSec(np.sec,true);
    else if(np.sec>0)npGoSec(np.sec-1,true);
    else if(np.cur>0){const p=np.anchors[np.cur-1];npScrollTo(p[p.length-1].el,true)}}
}
function npKeepScroll(){const b=document.getElementById('vscroll');const y=b?b.scrollTop:0;return()=>{const b2=document.getElementById('vscroll');if(b2){b2.scrollTop=y;npSync(true)}}}
function refreshNoPlay(){if(!S.sets[S.np.setId]){S.view='sets';return render()}if(npSig()===S.np.sig)return;const y=npKeepScroll();renderNoPlay();y()}
function npTranspose(d){
  const np=S.np,set=S.sets[np.setId];if(!setPerm(set,'transpose')){toast('Você não tem permissão para mudar o tom neste repertório.');return}
  const c=clone(set);const it=c.items[np.cur];if(!it)return;it.transpose=normSemis((it.transpose||0)+d);persist(c,700);
  const el=document.getElementById('nps-'+np.cur);if(el){el.outerHTML=npSongHTML(S.sets[np.setId],np.cur)}
  const b=document.querySelector(`#npSongs button[data-i="${np.cur}"] .k`);const s=S.songs[it.songId];if(b&&s&&s.key)b.textContent=keyAt(s.key,it.transpose);
  np.sig=npSig();npAnchors();npSync(true);
}
function npKey(e){
  const k=e.key;
  if(/^[1-9]$/.test(k)){e.preventDefault();npGoSong(+k-1,true);return}
  switch(k){
    case 'ArrowRight':e.preventDefault();npGoSong(S.np.cur+1,true);break;
    case 'ArrowLeft':e.preventDefault();npGoSong(S.np.cur-1,true);break;
    case 'ArrowDown':case 'PageDown':e.preventDefault();npStep(1);break;
    case 'ArrowUp':case 'PageUp':e.preventDefault();npStep(-1);break;
    case 'Home':e.preventDefault();npGoSec(0,true);break;
    case ' ':e.preventDefault();toggleScroll();break;
    case ']':npTranspose(1);break;case '[':npTranspose(-1);break;
    case '+':case '=':document.querySelector('[data-act=np-font][data-d="2"]').click();break;
    case '-':document.querySelector('[data-act=np-font][data-d="-2"]').click();break;
    case 'f':case 'F':document.querySelector('[data-act=v-full]').click();break;
    case 'c':case 'C':document.querySelector('[data-act=np-chords]')?.click();break;
    case 'Escape':exitNoPlay();break;
  }
}

/* ---- Busca rápida (Ctrl+K) ---- */
function quickOpen(){
  let q='',sel=0;
  const m=modal(`<div class="mb" style="padding-top:16px"><input type="search" id="qq" placeholder="Abrir música…" autocomplete="off"><ul class="pick" id="ql"></ul></div><div class="mf" style="justify-content:space-between"><span class="hint"><kbd>↑</kbd><kbd>↓</kbd> escolher · <kbd>Enter</kbd> abrir</span></div>`);
  let res=[];
  const draw=()=>{res=songsSorted().filter(s=>matches(s,q)).slice(0,12);if(sel>=res.length)sel=0;
    m.el.querySelector('#ql').innerHTML=res.map((s,i)=>`<li data-q="${i}" style="cursor:pointer;${i===sel?'border-color:var(--accent)':''}"><div class="li-main"><div class="li-t">${esc(s.title)}</div><div class="li-a">${esc(s.artist||'')}</div></div>${s.key?`<span class="key">${esc(keyAt(s.key,s.transpose||0))}</span>`:''}</li>`).join('')||'<p>Nada encontrado.</p>'};
  const go=i=>{const s=res[i];if(!s)return;m.close();
    const v=S.viewer;
    if(S.view==='viewer'&&v&&v.ids.includes(s.id)){goto(v.ids.indexOf(s.id),'next');return}
    const ids=songsSorted().map(x=>x.id);openViewer('library',ids,ids.indexOf(s.id))};
  draw();const qq=m.el.querySelector('#qq');qq.focus();
  qq.addEventListener('input',()=>{q=qq.value;sel=0;draw()});
  qq.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,res.length-1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);draw()}else if(e.key==='Enter'){e.preventDefault();go(sel)}});
  m.el.addEventListener('click',e=>{const li=e.target.closest('[data-q]');if(li)go(+li.dataset.q)});
}

/* ============ Importação ============ */
function normalizeText(t){return t.replace(/\r\n?/g,'\n').replace(/[   ]/g,' ').replace(/\t/g,'    ').replace(/[ ]+$/gm,'')}
function titleCase(s){return s.replace(/\s+/g,' ').trim().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase())}
function parseLink(raw){
  let url;try{url=new URL(raw.trim())}catch(e){return null}
  if(!/^https?:$/.test(url.protocol))return null;
  const h=url.hostname.replace(/^(www|m|music)\./,'');

  }

  if(/(^|\.)deezer\.com$|deezer\.page\.link$/.test(h))return {kind:'ref',site:'Deezer',url:url.href,artist:'',title:''};
  let site=h,artist='',title='',lyricsOnly=false;
  if(h.endsWith('cifraclub.com.br')){site='Cifra Club';artist=nice(seg[0]);title=nice(seg[1])}
  else if(h.endsWith('cifras.com.br')){const s=seg[0]==='cifra'?seg.slice(1):seg;site='Cifras.com.br';artist=nice(s[0]);title=nice(s[1])}
  else if(h.endsWith('ultimate-guitar.com')){const s=seg[0]==='tab'?seg.slice(1):seg;site='Ultimate Guitar';artist=nice(s[0]);title=nice((s[1]||'').replace(/-(chords|tabs?|ukulele|bass|official|guitar-pro|power)[-\w]*$/,'').replace(/-\d+$/,''))}
  else if(h.endsWith('e-chords.com')){const s=seg[0]==='chords'||seg[0]==='tabs'?seg.slice(1):seg;site='E-Chords';artist=nice(s[0]);title=nice(s[1])}
  else if(h.endsWith('letras.mus.br')||h.endsWith('letras.com')){site='Letras';artist=nice(seg[0]);title=nice(seg[1]);lyricsOnly=true}
  else{title=nice(seg[seg.length-1]||'')}

const JUNK_RE=/^\s*(composi[çc][ãa]o|letra e m[úu]sica|cifra club|exibir|vers[ãa]o\b|colabora[çc][ãa]o|enviad[ao] por|revis[ãa]o|ver (mais|cifra|tablatura)|tutorial|aprenda|simplificar|imprimir|parte \d+ de \d+|dicion[áa]rio|ouvir|ou[çc]a|videoaula|v[íi]deo aula|auto ?rolagem|transpor|meu cifra|baixar|compartilhar|favoritar|chords? by|tabbed by|difficulty|tuning)\b/i;
function parseChordPro(t){
  const r={title:'',artist:'',key:'',bpm:'',notes:''};const out=[];
  for(const line of t.split('\n')){
    if(/^\s*#/.test(line))continue;
    const m=line.match(/^\s*\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}\s*$/i);
    if(!m){out.push(line);continue}
    const d=m[1].toLowerCase(),v=(m[2]||'').trim();
    if(d==='title'||d==='t')r.title=v;
    else if(d==='artist'||d==='subtitle'||d==='st'||d==='composer')r.artist=r.artist||v;
    else if(d==='key')r.key=v;
    else if(d==='tempo')r.bpm=v;
    else if(d==='capo')r.notes=(r.notes?r.notes+' · ':'')+'Capotraste: '+v;
    else if(['comment','c','ci','comment_italic','cb','comment_box'].includes(d))out.push('['+v+']');
    else if(d==='soc'||d==='start_of_chorus')out.push('','['+(v||'Refrão')+']');
    else if(d==='sov'||d==='start_of_verse')out.push('','['+(v||'Verso')+']');
    else if(d==='sob'||d==='start_of_bridge')out.push('','['+(v||'Ponte')+']');
    else if(/^(eoc|eov|eob|end_of_)/.test(d))out.push('');
  }
  r.content=out.join('\n');return r;
}
function cleanImport(raw){
  let t=normalizeText(raw);
  let r={title:'',artist:'',key:'',bpm:'',notes:'',content:''};
  if(/^\s*\{\s*(title|t|artist|key|soc|start_of_chorus|c|comment|sov|subtitle)\s*[:}]/im.test(t)){r=parseChordPro(t);t=r.content}
  const notes=r.notes?[r.notes]:[];const out=[];
  for(const line of t.split('\n')){
    const km=line.match(/^\s*(tom|key|tonalidade)\s*[:\-]?\s*([A-G][#b]?m?)\b/i);
    if(km){if(!r.key)r.key=km[2].charAt(0).toUpperCase()+km[2].slice(1);const rest=line.slice(km[0].length).trim();if(/^\(.*\)$/.test(rest)===false&&rest&&!isChordLine(rest))notes.push(rest);continue}
    if(/^\s*capo(traste)?\b/i.test(line)){notes.push(line.trim());continue}
    if(/^\s*afina[çc][ãa]o\b/i.test(line)){if(!/padr[ãa]o|e a d g b e/i.test(line))notes.push(line.trim());continue}
    if(/^\s*(bpm|tempo)\s*[:\-]?\s*(\d{2,3})\b/i.test(line)){r.bpm=r.bpm||line.match(/(\d{2,3})/)[1];continue}
    if(JUNK_RE.test(line))continue;
    out.push(line);
  }
  // título/artista nas primeiras linhas (antes do primeiro acorde ou seção)
  const f=out.findIndex(l=>['ch','sec','cp','tab'].includes(classify(l)));
  if(f>0 && !r.title){
    const lead=out.slice(0,f).map(l=>l.trim()).filter(Boolean);
    if(lead.length>=1&&lead.length<=2&&lead.every(l=>l.length<60)){
      r.title=lead[0];r.artist=r.artist||lead[1]||'';out.splice(0,f);
    }
  }
  r.content=out.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^(\s*\n)+/,'').replace(/\s+$/,'');
  r.notes=notes.join(' · ');
  if(!r.key)r.key=detectKey(r.content);
  return r;
}
function startImported(r,extra){
  const s={...blankSong(),title:r.title||'',artist:r.artist||'',key:r.key||'',bpm:r.bpm||'',notes:r.notes||'',content:r.content||'',link:r.link||'',...(extra||{})};
  if(s.link&&!s.links){s.links={[linkKind(s.link)]:s.link}}

}

/* ---- PDF → texto alinhado (pdf.js) ---- */
const PDFJS_BASE='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/';
let pdfjsP=null;
function loadPdfjs(){
  if(!pdfjsP)pdfjsP=(async()=>{
    const lib=await import(PDFJS_BASE+'pdf.min.mjs');
    try{globalThis.pdfjsWorker=await import(PDFJS_BASE+'pdf.worker.min.mjs')}catch(e){}
    lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.mjs';
    return lib;
  })().catch(e=>{pdfjsP=null;throw e});
  return pdfjsP;
}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);return b[b.length>>1]}
function itemsToLines(items){
  // items: {s,x,y,w,fs}; retorna linhas de texto com colunas preservadas
  if(!items.length)return [];
  const cw=median(items.filter(i=>i.s.trim().length>=2&&i.w>0).map(i=>i.w/i.s.length))||median(items.map(i=>i.fs*0.6))||5;
  const minX=Math.min(...items.map(i=>i.x));
  const sorted=[...items].sort((a,b)=>b.y-a.y||a.x-b.x);
  const rows=[];
  for(const it of sorted){const r=rows[rows.length-1];if(r&&Math.abs(r.y-it.y)<=Math.max(2,it.fs*0.45))r.items.push(it);else rows.push({y:it.y,fs:it.fs,items:[it]})}
  const gaps=[];for(let i=1;i<rows.length;i++)gaps.push(rows[i-1].y-rows[i].y);
  const lh=median(gaps.filter(g=>g>0))||12;
  const out=[];
  rows.forEach((r,i)=>{
    if(i&&rows[i-1].y-r.y>lh*1.75)out.push('');
    let line='';
    for(const it of r.items.sort((a,b)=>a.x-b.x)){
      const col=Math.max(0,Math.round((it.x-minX)/cw));
      if(line.length<col)line+=' '.repeat(col-line.length);
      else if(line.length&&!/\s$/.test(line)&&!/^\s/.test(it.s))line+=' ';
      line+=it.s;
    }
    out.push(line.replace(/\s+$/,''));
  });
  return out;
}
// divide um trecho com espaços largos ("G        D" ou duas colunas na mesma linha) em pedaços com posição própria
function splitWide(it){
  if(!/\S\s{3,}\S/.test(it.s)||!it.w)return [it];
  const cw=it.w/it.s.length,out=[];const re=/\s{3,}/g;let last=0,m;
  const push=(a,b)=>{const t=it.s.slice(a,b);if(t.trim())out.push({...it,s:t,x:it.x+a*cw,w:t.length*cw})};
  while((m=re.exec(it.s))){push(last,m.index);last=m.index+m[0].length}
  push(last,it.s.length);
  return out;
}
async function pdfToText(file,onProg){
  const lib=await loadPdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  const pages=[];let chars=0;
  for(let p=1;p<=Math.min(doc.numPages,30);p++){
    const page=await doc.getPage(p);const vw=page.getViewport({scale:1}).width;
    const tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str!==undefined&&i.str.trim()!==''&&Math.abs(i.transform[1])<0.01)
      .map(i=>({s:i.str.replace(/\u00a0/g,' '),x:i.transform[4],y:i.transform[5],w:i.width,fs:Math.hypot(i.transform[2],i.transform[3])||10}))
      .flatMap(splitWide);
    chars+=items.reduce((n,i)=>n+i.s.trim().length,0);
    // duas colunas? procura um corte vertical que nenhum texto atravessa
    let split=null;
    if(items.length>=8){
      for(let sx=vw*0.38;sx<=vw*0.62;sx+=2){
        const cross=items.some(i=>i.x<sx&&i.x+i.w>sx+1);if(cross)continue;
        const L=items.filter(i=>i.x<sx).length,R=items.length-L;
        if(L>items.length*0.2&&R>items.length*0.2){split=sx;break}
      }
    }
    const cols=split?[items.filter(i=>i.x<split),items.filter(i=>i.x>=split)]:[items];
    pages.push(cols.flatMap((c,k)=>k?['',...itemsToLines(c)]:itemsToLines(c)));
    onProg&&onProg(p/doc.numPages);
  }
  if(chars<15){const e=new Error('semtexto');e.code='semtexto';throw e}
  // tira linhas de site/número de página e o recuo comum de cada página
  const junk=l=>!isChordLine(l)&&(/^\s*(p[áa]g(ina)?\.?\s*)?\d+\s*(\/|de)\s*\d+\s*$/i.test(l)||/(https?:\/\/|www\.)\S+/i.test(l.trim()));
  pages.forEach((pg,k)=>{
    pg=pg.filter(l=>!junk(l));
    const ind=Math.min(...pg.filter(l=>l.trim()).map(l=>l.match(/^ */)[0].length),99);
    pages[k]=ind&&ind<99?pg.map(l=>l.slice(Math.min(ind,l.match(/^ */)[0].length))):pg;
  });
  // remove cabeçalhos/rodapés repetidos em todas as páginas
  if(pages.length>1){
    // só as 3 primeiras e 3 últimas linhas de cada página podem ser cabeçalho/rodapé (versos repetidos ficam)
    const edge=pg=>{const ne=pg.map((l,i)=>[l.trim(),i]).filter(x=>x[0]);return new Set([...ne.slice(0,3),...ne.slice(-3)].map(x=>x[1]))};
    const cnt={};pages.forEach(pg=>{const e=edge(pg);new Set(pg.filter((l,i)=>e.has(i)).map(l=>l.trim())).forEach(l=>cnt[l]=(cnt[l]||0)+1)});
    pages.forEach((pg,k)=>{const e=edge(pg);pages[k]=pg.filter((l,i)=>{const t=l.trim();return !t||!e.has(i)||cnt[t]<pages.length||isChordLine(l)||classify(l)==='sec'})});
  }
  let meta={};try{meta=(await doc.getMetadata()).info||{}}catch(e){}
  const text=pages.map(pg=>pg.join('\n')).join('\n\n');
  return {text,title:(meta.Title||'').replace(/\s*[-|–]\s*(cifra club|cifras?).*$/i,'').trim(),pages:doc.numPages};
}
async function importPdfs(files,box){
  files=[...files].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');
  if(!files.length)return false;
  const res=[];
  for(let k=0;k<files.length;k++){
    const f=files[k];
    if(box)box.innerHTML=`<div class="hint" style="margin-bottom:6px">Lendo “${esc(f.name)}” (${k+1}/${files.length})…</div><div class="bar"><i id="pdfBar"></i></div>`;
    try{
      const r=await pdfToText(f,p=>{const b=document.getElementById('pdfBar');if(b)b.style.width=Math.round(p*100)+'%'});
      const c=cleanImport(r.text);
      if(!c.title)c.title=r.title||titleCase(f.name.replace(/\.pdf$/i,'').replace(/[-_]+/g,' '));
      res.push(c);
    }catch(e){
      const msg=e.code==='semtexto'?`“${f.name}” parece ser uma imagem escaneada (sem texto selecionável). Esse tipo de PDF ainda não pode ser lido — use um PDF gerado por site ou editor de texto.`
        :/import|fetch|module|Failed/i.test(String(e&&e.message))?'Não consegui carregar o leitor de PDF. Verifique a internet e tente de novo.':`Não consegui ler “${f.name}”.`;
      if(box)box.innerHTML=`<div class="info warn">${esc(msg)}</div>`;else toast(msg);
      if(files.length===1)return true;
    }
  }
  if(!res.length)return true;
  const cat=API_MODE&&isStaff();
  if(IMP&&IMP.m)IMP.m.close();
  if(res.length===1){startImported(res[0],{catalog:cat});toast('PDF convertido — revise e salve.');return true}
  res.forEach(r=>persist({...blankSong(),title:r.title,artist:r.artist,key:r.key,bpm:r.bpm,notes:r.notes,content:r.content,catalog:cat}));
  S.view='library';render();toast(res.length+' cifras importadas dos PDFs.');
  return true;
}

/* ===== NaNota — motor de transcrição harmônica (roda no navegador, sem servidor) =====

   → acordes (Viterbi com vocabulário de 7 qualidades + inversões) → compassos
   → partes (intro, verso, refrão, ponte, final) → paradas/convenções → cifra. */
const AU_Q=[
  {s:'',iv:[0,4,7],w:[1,1,.85],fam:'M',p:0},
  {s:'m',iv:[0,3,7],w:[1,1,.85],fam:'m',p:0},
  {s:'7',iv:[0,4,7,10],w:[1,1,.75,.8],fam:'M',p:-.05},
  {s:'m7',iv:[0,3,7,10],w:[1,1,.75,.8],fam:'m',p:-.05},
  {s:'7M',iv:[0,4,7,11],w:[1,1,.75,.8],fam:'M',p:-.22},
  {s:'9',iv:[0,4,7,2],w:[1,1,.75,.7],fam:'M',p:-.19},
  {s:'sus4',iv:[0,5,7],w:[1,1,.85],fam:'S',p:-.09},
  {s:'°',iv:[0,3,6],w:[1,1,1],fam:'d',p:-.11},

const AU_T=(()=>{const T=[];for(let r=0;r<12;r++)AU_Q.forEach((q,qi)=>{const v=new Float64Array(12);q.iv.forEach((d,j)=>v[(r+d)%12]=q.w[j]);
  let m=0;for(let i=0;i<12;i++)m+=v[i];m/=12;let n=0;for(let i=0;i<12;i++){v[i]-=m;n+=v[i]*v[i]}n=Math.sqrt(n);for(let i=0;i<12;i++)v[i]/=n;
  T.push({r,qi,q,z:v,tones:q.iv.map(d=>(r+d)%12)})});return T})();
function auZ(c){let m=0;for(let i=0;i<12;i++)m+=c[i];m/=12;const z=new Float64Array(12);let n=0;for(let i=0;i<12;i++){z[i]=c[i]-m;n+=z[i]*z[i]}n=Math.sqrt(n)||1;for(let i=0;i<12;i++)z[i]/=n;return z}
function auFFT(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=a+len/2;const xr=re[b]*cr-im[b]*ci,xi=re[b]*ci+im[b]*cr;re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}
}
const AU_KMAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],AU_KMIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function auCorr(a,b){const n=a.length;let ma=0,mb=0;for(let i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;let s=0,sa=0,sb=0;for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;s+=x*y;sa+=x*x;sb+=y*y}return s/Math.sqrt(sa*sb||1)}
const auYield=()=>new Promise(r=>setTimeout(r,0));

/** x: Float32Array mono; sr: taxa. Retorna {key,bpm,beats,chords,bars,sections,breaks,content}. */
async function auAnalyze(x,sr,onProg,opts){
  opts=opts||{};
  const prog=(p,t)=>onProg&&onProg(p,t);
  const N=8192,hop=2048,frames=Math.max(1,Math.floor((x.length-N)/hop)+1);
  const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const re=new Float64Array(N),im=new Float64Array(N);
  const binHz=sr/N,kLo=Math.floor(35/binHz),kHi=Math.min(N/2-2,Math.ceil(2200/binHz));
  // 1) espectros: picos por quadro (frequência refinada + magnitude)
  prog(0,'Lendo a harmonia…');
  const peaks=new Array(frames),rms=new Float32Array(frames),dev=[];
  for(let t=0;t<frames;t++){
    const o=t*hop;let e=0;
    for(let i=0;i<N;i++){const v=x[o+i]||0;e+=v*v;re[i]=v*win[i];im[i]=0}
    rms[t]=Math.sqrt(e/N);auFFT(re,im);
    const mag=new Float32Array(kHi+2);let mx=0;
    for(let k=kLo-1;k<=kHi+1;k++){mag[k]=Math.sqrt(re[k]*re[k]+im[k]*im[k]);if(mag[k]>mx)mx=mag[k]}
    const pk=[];
    if(mx>0)for(let k=kLo;k<=kHi;k++){const a=mag[k-1],b=mag[k],c=mag[k+1];
      if(b>a&&b>=c&&b>mx*0.02){const d=(a-c)/(2*(a-2*b+c)||1);const f=(k+Math.max(-.5,Math.min(.5,d)))*binHz;

  const ch=new Float32Array(frames*12),cb=new Float32Array(frames*12);
  for(let t=0;t<frames;t++){const pk=peaks[t];
    for(let i=0;i<pk.length;i+=3){const f=pk[i],mi=pk[i+1]-tune,w=pk[i+2],r=Math.round(mi);
      if(Math.abs(mi-r)>0.4)continue;const pc=((r%12)+12)%12;

  prog(0.5,'Detectando o andamento…');await auYield();
  const n2=1024,h2=512,F2=Math.max(1,Math.floor((x.length-n2)/h2));
  const w2=new Float32Array(n2);for(let i=0;i<n2;i++)w2[i]=0.5-0.5*Math.cos(2*Math.PI*i/(n2-1));
  const r2=new Float64Array(n2),i2=new Float64Array(n2),kmax2=Math.floor(5000/(sr/n2));
  let prev=new Float32Array(kmax2);const onset=new Float32Array(F2),srms=new Float32Array(F2);
  for(let t=0;t<F2;t++){const o=t*h2;let e2=0;for(let i=0;i<n2;i++){const v=x[o+i]||0;e2+=v*v;r2[i]=v*w2[i];i2[i]=0}srms[t]=Math.sqrt(e2/n2);auFFT(r2,i2);
    let s=0;const cur=new Float32Array(kmax2);
    for(let k=1;k<kmax2;k++){const m=Math.log(1+100*Math.sqrt(r2[k]*r2[k]+i2[k]*i2[k]));cur[k]=m;const d=m-prev[k];if(d>0)s+=d}
    onset[t]=s;prev=cur;if(t%400===0){prog(0.5+t/F2*0.15);await auYield()}}
  // remove tendência local e normaliza
  const ons=new Float32Array(F2);{const W=16;let acc=0;const q=[];for(let t=0;t<F2;t++){acc+=onset[t];q.push(onset[t]);if(q.length>2*W)acc-=q.shift();ons[t]=Math.max(0,onset[t]-acc/q.length)}
    let sd=0;for(let t=0;t<F2;t++)sd+=ons[t]*ons[t];sd=Math.sqrt(sd/F2)||1;for(let t=0;t<F2;t++)ons[t]/=sd}
  const fps=sr/h2;
  let best=-1,bp=0;
  for(let bpm=60;bpm<=180;bpm+=0.5){const L=fps*60/bpm;let s=0;
    for(let t=Math.ceil(L*2);t<F2;t++){const a=t-L,i0=Math.floor(a),fr=a-i0;s+=ons[t]*(ons[i0]*(1-fr)+ons[i0+1]*fr)+0.5*ons[t]*(ons[Math.round(t-2*L)]||0)}

  else{addD(0,'m',.12);addD(3,'M',.11);addD(5,'m',.1);addD(7,'M',.1);addD(7,'m',.06);addD(8,'M',.11);addD(10,'M',.11);addD(2,'d',.05)}

  for(let b=0;b<B;b++){const e=new Float64Array(S+1),silent=be[b]<eMax*0.06;const z=auZ(bc[b]),bd=bb[b];
    let bm=0;for(let i=1;i<12;i++)if(bd[i]>bd[bm])bm=i;
